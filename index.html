<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XIVIVIDE Monitor</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                bg: '#09090b', panel: '#121215', card: '#18181b',
                line: '#27272a', tx: '#f4f4f5', mut: '#a1a1aa',
                accent: '#6366f1', danger: '#ef4444', success: '#10b981'
            },
            fontFamily: {
                sans: ['"Inter"', 'system-ui', 'sans-serif'],
                mono: ['"JetBrains Mono"', 'monospace']
            }
        }
    }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body class="h-full bg-bg text-tx font-sans antialiased selection:bg-accent/30 selection:text-white">

<!-- Экран Авторизации -->
<div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-bg p-4 hidden">
    <div class="w-full max-w-[360px]">
        <h2 id="auth-title" class="mb-6 text-xl font-semibold text-center">Вход в систему</h2>
        <form id="auth-form" class="flex flex-col gap-3">
            <input type="text" id="auth-user" placeholder="Логин" class="h-10 w-full rounded-md border border-line bg-panel px-3 text-sm text-tx outline-none focus:border-accent" required>
            <input type="password" id="auth-pass" placeholder="Пароль" class="h-10 w-full rounded-md border border-line bg-panel px-3 text-sm text-tx outline-none focus:border-accent" required>
            <input type="password" id="auth-confirm" placeholder="Повторите пароль" class="h-10 w-full rounded-md border border-line bg-panel px-3 text-sm text-tx outline-none focus:border-accent hidden" required>
            <button type="submit" id="auth-btn" class="mt-2 flex h-10 w-full items-center justify-center rounded-md bg-tx text-black font-semibold hover:bg-zinc-300 transition-colors">Войти</button>
        </form>
        <div class="mt-4 text-center text-xs text-mut">
            <span id="auth-switch-text">Нет аккаунта?</span>
            <button type="button" id="auth-switch" class="ml-1 font-medium text-accent hover:underline">Создать</button>
        </div>
    </div>
</div>

<!-- Основной Дашборд -->
<div id="app-screen" class="hidden h-full flex flex-col">
    <nav class="flex h-14 shrink-0 items-center justify-between border-b border-line bg-bg px-4 sm:px-6">
        <div class="flex items-center gap-2">
            <span class="text-sm font-bold tracking-widest text-tx uppercase">XIVIVIDE</span>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2 w-2">
                    <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-success opacity-75"></span>
                    <span class="relative inline-flex h-2 w-2 rounded-full bg-success"></span>
                </span>
                <span id="current-user-display" class="text-xs font-medium text-mut"></span>
            </div>
            <button id="logout-btn" class="text-xs font-medium text-mut hover:text-tx transition-colors">Выйти</button>
        </div>
    </nav>

    <div class="mx-auto flex w-full max-w-[1300px] flex-1 items-start gap-6 p-4 sm:p-6 lg:flex-row flex-col">
        
        <!-- Сайдбар -->
        <aside class="flex w-full flex-col gap-6 lg:sticky lg:top-[80px] lg:w-[260px] shrink-0">
            
            <!-- Добавление цели (Одной строкой) -->
            <div>
                <h3 class="mb-2 text-xs font-semibold text-mut uppercase tracking-wider">Добавить цель</h3>
                <div class="relative flex items-center">
                    <input type="text" id="new-target-id" placeholder="Вставьте Discord ID" class="h-9 w-full rounded-md border border-line bg-panel pl-3 pr-16 text-xs text-tx outline-none focus:border-accent font-mono">
                    <button id="add-target-btn" class="absolute right-1 top-1 bottom-1 rounded bg-tx px-3 text-[11px] font-semibold text-black hover:bg-zinc-300 transition">Add</button>
                </div>
            </div>

            <!-- Список целей -->
            <div class="flex flex-col">
                <div class="mb-2 flex items-center justify-between">
                    <h3 class="text-xs font-semibold text-mut uppercase tracking-wider">Активные</h3>
                    <span id="target-count" class="text-xs font-mono text-mut"></span>
                </div>
                <div id="target-list" class="flex max-h-[300px] flex-col gap-0.5 overflow-y-auto pr-1"></div>
            </div>

            <!-- Навигация по вкладкам -->
            <nav class="flex flex-col gap-0.5 border-t border-line pt-4" id="menu"></nav>

        </aside>

        <!-- Основной контент -->
        <main class="min-w-0 flex-1">
            <!-- Состояние загрузки -->
            <div id="loader" class="flex h-[400px] flex-col items-center justify-center gap-3 text-mut">
                <svg class="h-6 w-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-sm">Загрузка...</span>
            </div>
            
            <!-- Пустое состояние -->
            <div id="empty-state" class="hidden h-[400px] flex-col items-center justify-center border border-dashed border-line rounded-xl bg-panel/30">
                <p class="text-sm text-mut">Выберите цель слева</p>
            </div>

            <!-- Контент вкладок -->
            <div id="content" class="fade-in"></div>
        </main>
    </div>
</div>

<script>
// ============ ИКОНКИ ============
const ICONS = {
    profile: '<path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>',
    server: '<path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>',
    tag: '<path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>',
    image: '<path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    users: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>',
    cal: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    mic: '<path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>',
    id: '<path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>',
    clock: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>'
};
const icon = (name, cls = "h-4 w-4") => `<svg class="${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">${ICONS[name] || ''}</svg>`;
const avatarPlaceholder = (str) => {
    const safeStr = str || '?';
    let hash = 0;
    for (let i = 0; i < safeStr.length; i++) hash = safeStr.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="hsl(${hue},30%,15%)"/><text x="32" y="45" font-size="32" font-family="sans-serif" font-weight="600" text-anchor="middle" fill="hsl(${hue},70%,70%)">${safeStr.charAt(0).toUpperCase()}</text></svg>`)}`;
};

// ИСПРАВЛЕНИЕ ДАТЫ (чтобы не было NaN)
const formatDate = (isoStr) => {
    if (!isoStr || isoStr === 'unknown') return 'Неизвестно';
    if (/^\d{2}\.\d{2}\.\d{4}/.test(isoStr)) return isoStr;
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr;
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const formatMinutes = (min) => {
    const h = Math.floor(min / 60), m = min % 60;
    return h > 0 ? `${h}ч ${m}м` : `${m}м`;
};

// ============ СОСТОЯНИЕ ============
let DATA = {}, CURRENT_TARGET = null, USER_ID = null, userTargets = [], isRegistering = false;

// ============ АВТОРИЗАЦИЯ ============
const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const authForm = document.getElementById('auth-form');

document.getElementById('auth-switch').addEventListener('click', () => {
    isRegistering = !isRegistering;
    document.getElementById('auth-title').textContent = isRegistering ? 'Регистрация' : 'Вход в систему';
    document.getElementById('auth-btn').textContent = isRegistering ? 'Создать' : 'Войти';
    document.getElementById('auth-switch-text').textContent = isRegistering ? 'Есть аккаунт?' : 'Нет аккаунта?';
    document.getElementById('auth-switch').textContent = isRegistering ? 'Войти' : 'Создать';
    document.getElementById('auth-confirm').classList.toggle('hidden', !isRegistering);
    document.getElementById('auth-confirm').required = isRegistering;
});

authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value;
    const c = document.getElementById('auth-confirm').value;
    if (isRegistering && p !== c) return alert("Пароли не совпадают!");

    const btn = document.getElementById('auth-btn');
    btn.disabled = true; btn.textContent = '...';

    try {
        const res = await fetch(isRegistering ? '/api/register' : '/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            checkAuth();
        } else alert(data.detail || "Ошибка");
    } catch (e) { alert("Сервер недоступен"); }
    finally { btn.disabled = false; btn.textContent = isRegistering ? 'Создать' : 'Войти'; }
});

document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.clear(); checkAuth();
});

function checkAuth() {
    USER_ID = localStorage.getItem('user_id');
    if (USER_ID) {
        document.getElementById('current-user-display').textContent = localStorage.getItem('username');
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadTargets();
        loadData();
        setInterval(loadData, 10000);
    } else {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
    }
}

// ============ УПРАВЛЕНИЕ ЦЕЛЯМИ ============
async function loadTargets() {
    if (!USER_ID) return;
    try {
        const res = await fetch(`/api/my_targets/${USER_ID}`);
        userTargets = await res.json();
        renderTargetList();
    } catch (e) {}
}

function renderTargetList() {
    const list = document.getElementById('target-list');
    document.getElementById('target-count').textContent = userTargets.length || '';

    if (userTargets.length === 0) {
        list.innerHTML = `<div class="text-xs text-mut py-2">Нет целей</div>`;
        return;
    }

    list.innerHTML = userTargets.map(t => {
        const isSelected = CURRENT_TARGET === t.target_id;
        // Если бот уже прислал имя, используем его, иначе показываем ID
        const displayName = DATA.targets?.[t.target_id]?.user?.display || t.target_name || t.target_id;
        
        return `
        <div class="group flex cursor-pointer items-center justify-between rounded-md px-2 py-1.5 transition-colors ${isSelected ? 'bg-line' : 'hover:bg-line/50'}" onclick="selectTarget('${t.target_id}')">
            <span class="truncate text-sm ${isSelected ? 'text-tx font-medium' : 'text-mut'}">${displayName}</span>
            <button class="flex h-5 w-5 shrink-0 items-center justify-center rounded text-mut opacity-0 hover:bg-danger/20 hover:text-danger group-hover:opacity-100" onclick="event.stopPropagation(); removeTarget('${t.target_id}')">
                <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>`;
    }).join('');
}

function selectTarget(id) {
    CURRENT_TARGET = id;
    renderTargetList();
    render();
}

document.getElementById('add-target-btn').addEventListener('click', async () => {
    const input = document.getElementById('new-target-id');
    const tid = input.value.trim();

    if (!tid || !/^\d{17,20}$/.test(tid)) {
        input.classList.add('border-danger');
        return setTimeout(() => input.classList.remove('border-danger'), 1000);
    }

    try {
        const res = await fetch(`/api/add_target/${USER_ID}`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ target_id: tid, target_name: tid }) // Передаем ID как временное имя
        });
        if (res.ok) {
            input.value = '';
            await loadTargets();
            selectTarget(tid);
        } else {
            const err = await res.json();
            alert(err.detail);
        }
    } catch (e) { alert("Ошибка сервера"); }
});

window.removeTarget = async (tid) => {
    if (!confirm("Удалить цель?")) return;
    try {
        await fetch(`/api/remove_target/${USER_ID}/${tid}`, { method: 'DELETE' });
        if (CURRENT_TARGET === tid) CURRENT_TARGET = null;
        await loadTargets();
        if (userTargets.length > 0 && !CURRENT_TARGET) selectTarget(userTargets[0].target_id);
        else render();
    } catch (e) {}
};

// ============ ОТОБРАЖЕНИЕ ============
const TABS = [
    { id: 'profile', label: 'Профиль', icon: 'profile' },
    { id: 'servers', label: 'Серверы', icon: 'server' },
    { id: 'nicks', label: 'Никнеймы', icon: 'tag' },
    { id: 'media', label: 'Медиа', icon: 'image' },
    { id: 'friends', label: 'Знакомые', icon: 'users' },
    { id: 'events', label: 'События', icon: 'cal' }
];

function render() {
    const hash = (location.hash.slice(1) || 'profile');
    const activeTab = TABS.find(t => t.id === hash) ? hash : 'profile';

    // Обновляем меню
    document.getElementById('menu').innerHTML = TABS.map(t => {
        const isActive = t.id === activeTab;
        return `<a href="#${t.id}" class="flex h-8 items-center gap-2.5 rounded px-2 text-sm transition-colors ${isActive ? 'text-tx font-medium bg-line/30' : 'text-mut hover:text-tx hover:bg-line/30'}">
            ${icon(t.icon, `h-3.5 w-3.5 ${isActive ? 'text-accent' : 'text-mut'}`)} ${t.label}
        </a>`;
    }).join('');

    const loader = document.getElementById('loader');
    const emptyState = document.getElementById('empty-state');
    const content = document.getElementById('content');

    if (!CURRENT_TARGET) {
        loader.style.display = 'none';
        emptyState.style.display = 'flex';
        content.innerHTML = '';
        return;
    }

    emptyState.style.display = 'none';
    loader.style.display = 'none';

    const targetData = DATA.targets?.[CURRENT_TARGET];
    if (!targetData) {
        content.innerHTML = `<div class="flex h-[400px] flex-col items-center justify-center text-mut">
            <svg class="mb-3 h-6 w-6 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            <p class="text-sm">Ожидание данных...</p>
        </div>`;
        return;
    }

    content.innerHTML = renderTab(activeTab, targetData);
}

function renderTab(tabId, data) {
    switch (tabId) {
        case 'profile': return renderProfile(data);
        case 'servers': return renderServers(data);
        case 'nicks': return renderNicks(data);
        case 'media': return renderMedia(data);
        case 'friends': return renderFriends(data);
        case 'events': return renderEvents(data);
        default: return '';
    }
}

function renderProfile(data) {
    const u = data.user;
    const l = data.lastVoice || { server: '-', channel: '-', left: '-' };
    const isNoVoice = l.server === '-' || !l.server;

    const row = (iconName, label, value) => `
        <div class="flex flex-col gap-1 border-b border-line/50 py-3 sm:flex-row sm:items-center">
            <span class="flex w-40 shrink-0 items-center gap-2 text-xs font-medium text-mut">
                ${icon(iconName, 'h-3.5 w-3.5')} ${label}
            </span>
            <span class="break-all text-sm font-medium text-tx">${value}</span>
        </div>`;

    return `
    <div class="grid gap-4 lg:grid-cols-3">
        <div class="flex flex-col gap-3 rounded-xl border border-line bg-panel p-3">
            <div class="aspect-square w-full overflow-hidden rounded-lg border border-line bg-bg">
                <img src="${u.avatar_url || avatarPlaceholder(u.display)}" class="h-full w-full object-cover" onerror="this.src='${avatarPlaceholder(u.display)}'">
            </div>
            <div class="flex flex-col text-center">
                <h2 class="text-base font-bold text-tx truncate">${u.display}</h2>
                <p class="font-mono text-xs text-mut truncate">@${u.username}</p>
            </div>
        </div>
        
        <div class="flex flex-col rounded-xl border border-line bg-panel px-4 py-2 lg:col-span-2">
            ${row('user', 'Username', `@${u.username}`)}
            ${row('id', 'Discord ID', `<span class="font-mono text-xs">${u.id}</span>`)}
            ${row('cal', 'Регистрация', formatDate(u.reg))}
            ${row('clock', 'Время в войсе', u.voice || '0ч 0м')}
        </div>

        <div class="rounded-xl border border-line bg-panel p-4 lg:col-span-3 flex items-center gap-4">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-line">
                ${icon('mic', 'h-5 w-5 text-mut')}
            </div>
            <div class="min-w-0">
                <h4 class="text-xs font-semibold text-mut uppercase tracking-wider mb-1">Последняя сессия</h4>
                <div class="text-sm font-medium text-tx truncate">
                    ${isNoVoice ? 'Нет данных' : `${l.server} / ${l.channel}`}
                </div>
            </div>
            <div class="ml-auto text-xs text-mut text-right">
                ${isNoVoice ? '' : l.left}
            </div>
        </div>
    </div>`;
}

function renderServers(data) {
    const servers = data.servers || [];
    if (servers.length === 0) return renderEmpty('Нет общих серверов');
    return `<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        ${servers.map(s => `
        <div class="flex items-center gap-3 rounded-lg border border-line bg-panel p-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md bg-line font-bold text-sm text-tx">${s.n.charAt(0).toUpperCase()}</div>
            <div class="min-w-0">
                <h4 class="truncate text-sm font-semibold text-tx">${s.n}</h4>
                <div class="text-xs text-mut mt-0.5">Участников: ${s.m.toLocaleString('ru-RU')} · В голосе: ${s.v}</div>
            </div>
        </div>`).join('')}
    </div>`;
}

function renderNicks(data) {
    const nicks = data.nicks || [];
    if (nicks.length === 0) return renderEmpty('История никнеймов пуста');
    return `<div class="rounded-xl border border-line bg-panel overflow-hidden">
        <table class="w-full text-left text-sm">
            <thead class="border-b border-line bg-bg text-xs font-medium text-mut">
                <tr><th class="px-4 py-2">Никнейм</th><th class="px-4 py-2">Источник</th><th class="px-4 py-2 text-right">Дата</th></tr>
            </thead>
            <tbody class="divide-y divide-line/50">
                ${nicks.map(n => `<tr>
                    <td class="px-4 py-2.5 text-tx">${n[0]}</td>
                    <td class="px-4 py-2.5 text-mut">${n[1]}</td>
                    <td class="px-4 py-2.5 text-right font-mono text-xs text-mut">${formatDate(n[2])}</td>
                </tr>`).join('')}
            </tbody>
        </table>
    </div>`;
}

function renderMedia(data) {
    const media = data.media || [];
    if (media.length === 0) return renderEmpty('Нет аватарок');
    return `<div class="grid grid-cols-3 gap-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6">
        ${media.map(m => {
            const isUrl = m.s && m.s.startsWith('http');
            return `<div class="aspect-square overflow-hidden rounded-lg border border-line bg-panel">
                <img src="${isUrl ? m.s : avatarPlaceholder('?')}" class="h-full w-full object-cover" loading="lazy" onerror="this.src='${avatarPlaceholder('?')}'">
            </div>`;
        }).join('')}
    </div>`;
}

function renderFriends(data) {
    const friends = data.friends || [];
    if (friends.length === 0) return renderEmpty('Нет совместных сессий');
    return `<div class="rounded-xl border border-line bg-panel overflow-hidden">
        <table class="w-full text-left text-sm">
            <thead class="border-b border-line bg-bg text-xs font-medium text-mut">
                <tr><th class="px-4 py-2">Пользователь</th><th class="px-4 py-2">Время</th><th class="px-4 py-2 text-right">Последний раз</th></tr>
            </thead>
            <tbody class="divide-y divide-line/50">
                ${friends.map(f => `<tr>
                    <td class="px-4 py-2.5 font-medium text-tx">${f.u}</td>
                    <td class="px-4 py-2.5 text-mut">${formatMinutes(f.min)}</td>
                    <td class="px-4 py-2.5 text-right font-mono text-xs text-mut">${f.last}</td>
                </tr>`).join('')}
            </tbody>
        </table>
    </div>`;
}

function renderEvents(data) {
    const sessions = data.sessions || [];
    if (sessions.length === 0) return renderEmpty('История сессий пуста');
    return `<div class="rounded-xl border border-line bg-panel overflow-hidden">
        <table class="w-full text-left text-sm">
            <thead class="border-b border-line bg-bg text-xs font-medium text-mut">
                <tr><th class="px-4 py-2">Сервер</th><th class="px-4 py-2">Канал</th><th class="px-4 py-2">Время</th><th class="px-4 py-2 text-right">Период</th></tr>
            </thead>
            <tbody class="divide-y divide-line/50">
                ${sessions.map(s => `<tr>
                    <td class="px-4 py-2.5 font-medium text-tx">${s.srv}</td>
                    <td class="px-4 py-2.5 text-mut">#${s.ch}</td>
                    <td class="px-4 py-2.5 font-mono text-xs ${s.dur === 'В сети' ? 'text-success' : 'text-mut'}">${s.dur}</td>
                    <td class="px-4 py-2.5 text-right font-mono text-xs text-mut">${s.per}</td>
                </tr>`).join('')}
            </tbody>
        </table>
    </div>`;
}

function renderEmpty(msg) {
    return `<div class="flex h-64 items-center justify-center rounded-xl border border-dashed border-line bg-panel/30">
        <p class="text-sm text-mut">${msg}</p>
    </div>`;
}

async function loadData() {
    if (!USER_ID) return;
    try {
        const res = await fetch('/api/data');
        DATA = await res.json();
        if (CURRENT_TARGET) render();
        renderTargetList(); // Обновляем имена в списке, если бот их подтянул
    } catch (e) {}
}

window.addEventListener('hashchange', render);
checkAuth();
</script>
</body>
</html>
