<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XIVIVIDE Monitor</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                bg: '#09090b', panel: '#121215', card: '#18181b',
                line: '#27272a', tx: '#f4f4f5', mut: '#a1a1aa',
                accent: '#6366f1', danger: '#ef4444', success: '#10b981'
            },
            fontFamily: {
                sans: ['"Inter"', 'system-ui', 'sans-serif'],
                mono: ['"JetBrains Mono"', 'monospace']
            }
        }
    }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    /* СТАТИЧНЫЙ КРАСИВЫЙ ФОН С X */
    .bg-x-pattern {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        pointer-events: none;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .bg-x-svg {
        width: 90vw;
        height: 90vh;
        opacity: 0.03;
        color: #6366f1;
    }
    .bg-glow {
        position: absolute;
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 100vw; height: 100vh;
        background: radial-gradient(circle at center, rgba(99, 102, 241, 0.1) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
    }
    .content-wrapper { position: relative; z-index: 10; }
</style>
</head>
<body class="h-full bg-bg text-tx font-sans antialiased selection:bg-accent/30 selection:text-white relative">

<!-- ФОН С БУКВОЙ X -->
<div class="bg-x-pattern">
    <div class="bg-glow"></div>
    <svg class="bg-x-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M 15 15 L 85 85 M 85 15 L 15 85" stroke="currentColor" stroke-width="8" stroke-linecap="round" fill="none" />
    </svg>
</div>

<!-- Модальное окно для аватарок -->
<div id="image-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4 cursor-zoom-out" onclick="this.classList.add('hidden'); this.classList.remove('flex');">
    <img id="modal-img" src="" class="max-w-full max-h-[90vh] rounded-lg object-contain shadow-2xl" onclick="event.stopPropagation()">
</div>

<!-- Экран Авторизации -->
<div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-bg/95 p-4 hidden">
    <div class="w-full max-w-[360px] relative z-10">
        <h2 id="auth-title" class="mb-6 text-xl font-semibold text-center">Вход в систему</h2>
        <form id="auth-form" class="flex flex-col gap-3">
            <input type="text" id="auth-user" placeholder="Логин" class="h-10 w-full rounded-md border border-line bg-panel px-3 text-sm text-tx outline-none focus:border-accent" required>
            <input type="password" id="auth-pass" placeholder="Пароль" class="h-10 w-full rounded-md border border-line bg-panel px-3 text-sm text-tx outline-none focus:border-accent" required>
            <input type="password" id="auth-confirm" placeholder="Повторите пароль" class="h-10 w-full rounded-md border border-line bg-panel px-3 text-sm text-tx outline-none focus:border-accent hidden" required>
            <button type="submit" id="auth-btn" class="mt-2 flex h-10 w-full items-center justify-center rounded-md bg-tx text-black font-semibold hover:bg-zinc-300 transition-colors">Войти</button>
        </form>
        <div class="mt-4 text-center text-xs text-mut">
            <span id="auth-switch-text">Нет аккаунта?</span>
            <button type="button" id="auth-switch" class="ml-1 font-medium text-accent hover:underline">Создать</button>
        </div>
    </div>
</div>

<!-- Основной Дашборд -->
<div id="app-screen" class="hidden h-full flex flex-col content-wrapper">
    <nav class="flex h-14 shrink-0 items-center justify-between border-b border-line bg-bg/80 backdrop-blur-md px-4 sm:px-6">
        <div class="flex items-center gap-4">
            <span class="text-sm font-bold tracking-widest text-tx uppercase shrink-0">XIVIVIDE</span>
        </div>
        
        <div class="flex items-center gap-4 shrink-0">
            <div class="hidden sm:flex items-center gap-2">
                <div class="relative w-64">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-4 h-4 text-mut" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </div>
                    <input type="text" id="new-target-id" placeholder="Введите Discord ID" class="h-9 w-full rounded-md border border-line bg-panel pl-9 pr-3 text-sm text-tx outline-none focus:border-accent">
                </div>
                <button id="add-target-btn" class="h-9 shrink-0 rounded-md bg-accent px-4 text-sm font-medium text-white hover:bg-accentHover transition">Добавить</button>
            </div>

            <div class="relative ml-2">
                <button id="user-menu-btn" class="flex items-center gap-2 p-1.5 pr-3 rounded-full hover:bg-[#1e1f22] border border-transparent hover:border-line transition">
                    <div class="w-7 h-7 rounded-full bg-accent/20 flex items-center justify-center text-accent font-bold text-xs" id="user-avatar-placeholder">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <span id="current-user-display" class="text-sm font-semibold text-tx hidden sm:block"></span>
                </button>
                
                <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-[#18181b] border border-line rounded-xl shadow-xl z-50 p-1">
                    <button id="logout-btn" class="w-full text-left px-3 py-2 text-sm text-danger hover:bg-danger/10 rounded-lg transition flex items-center gap-2 font-medium">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Выйти
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="mx-auto flex w-full max-w-[1300px] flex-1 items-start gap-6 p-4 sm:p-6 lg:flex-row flex-col">
        <aside class="flex w-full flex-col gap-4 lg:sticky lg:top-[80px] lg:w-[240px] shrink-0">
            <nav class="flex flex-col gap-1">
                <a href="#feed" class="flex h-9 items-center gap-2.5 rounded-lg px-3 text-sm font-medium transition-colors" id="nav-feed">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Лента
                </a>
                <a href="#tracking" class="flex h-9 items-center gap-2.5 rounded-lg px-3 text-sm font-medium transition-colors" id="nav-tracking">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    Отслеживание
                </a>
            </nav>

            <div id="sub-menu-container" class="hidden border-t border-line pt-4 mt-1">
                <h3 class="mb-2 px-2 text-[10px] font-semibold text-mut uppercase tracking-wider" id="selected-target-name">Вкладки</h3>
                <nav class="flex flex-col gap-1" id="sub-menu"></nav>
            </div>
        </aside>

        <main class="min-w-0 flex-1">
            <div id="loader" class="flex h-[400px] flex-col items-center justify-center gap-3 text-mut">
                <svg class="h-6 w-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-sm">Загрузка...</span>
            </div>
            <div id="content" class="fade-in"></div>
        </main>
    </div>
</div>

<script>
const ICONS = {
    feed: '<path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    tracking: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>',
    profile: '<path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>',
    server: '<path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>',
    tag: '<path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>',
    image: '<path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    users: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>',
    cal: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    mic: '<path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>',
    id: '<path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>',
    clock: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>'
};
const icon = (name, cls = "h-4 w-4") => `<svg class="${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">${ICONS[name] || ''}</svg>`;

const avatarPlaceholder = (str) => {
    const safeStr = str || '?';
    let hash = 0;
    for (let i = 0; i < safeStr.length; i++) hash = safeStr.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="hsl(${hue},30%,15%)"/><text x="32" y="45" font-size="32" font-family="sans-serif" font-weight="600" text-anchor="middle" fill="hsl(${hue},70%,70%)">${safeStr.charAt(0).toUpperCase()}</text></svg>`)}`;
};

const formatDate = (isoStr) => {
    if (!isoStr || isoStr === 'unknown') return 'Неизвестно';
    if (/^\d{2}\.\d{2}\.\d{4}/.test(isoStr)) return isoStr;
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr;
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)} в ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const formatMinutes = (min) => {
    const h = Math.floor(min / 60), m = min % 60;
    return h > 0 ? `${h}ч ${m}м` : `${m}м`;
};

let DATA = {}, CURRENT_TARGET = null, USER_ID = null, userTargets = [], isRegistering = false;

const userMenuBtn = document.getElementById('user-menu-btn');
const userDropdown = document.getElementById('user-dropdown');

userMenuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    userDropdown.classList.toggle('hidden');
});

document.addEventListener('click', (e) => {
    if (!userDropdown.classList.contains('hidden') && !userDropdown.contains(e.target)) {
        userDropdown.classList.add('hidden');
    }
});

const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const authForm = document.getElementById('auth-form');

document.getElementById('auth-switch').addEventListener('click', () => {
    isRegistering = !isRegistering;
    document.getElementById('auth-title').textContent = isRegistering ? 'Регистрация' : 'Вход в систему';
    document.getElementById('auth-btn').textContent = isRegistering ? 'Создать' : 'Войти';
    document.getElementById('auth-switch-text').textContent = isRegistering ? 'Есть аккаунт?' : 'Нет аккаунта?';
    document.getElementById('auth-switch').textContent = isRegistering ? 'Войти' : 'Создать';
    document.getElementById('auth-confirm').classList.toggle('hidden', !isRegistering);
    document.getElementById('auth-confirm').required = isRegistering;
});

authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value;
    const c = document.getElementById('auth-confirm').value;
    if (isRegistering && p !== c) return alert("Пароли не совпадают!");

    const btn = document.getElementById('auth-btn');
    btn.disabled = true; btn.textContent = '...';

    try {
        const res = await fetch(isRegistering ? '/api/register' : '/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            checkAuth();
        } else alert(data.detail || "Ошибка");
    } catch (e) { alert("Сервер недоступен"); }
    finally { btn.disabled = false; btn.textContent = isRegistering ? 'Создать' : 'Войти'; }
});

document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.clear(); checkAuth();
});

function checkAuth() {
    USER_ID = localStorage.getItem('user_id');
    if (USER_ID) {
        const username = localStorage.getItem('username');
        document.getElementById('current-user-display').textContent = username;
        document.getElementById('user-avatar-placeholder').textContent = username.charAt(0).toUpperCase();
        
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadTargets();
        loadData();
        setInterval(loadData, 10000);
    } else {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
    }
}

async function loadTargets() {
    if (!USER_ID) return;
    try {
        const res = await fetch(`/api/my_targets/${USER_ID}`);
        userTargets = await res.json();
        const hash = location.hash.slice(1) || 'feed';
        if (['profile', 'servers', 'nicks', 'media', 'friends', 'events'].includes(hash)) {
            if (!CURRENT_TARGET && userTargets.length > 0) {
                CURRENT_TARGET = userTargets[0].target_id;
            }
        }
        render();
    } catch (e) {}
}

document.getElementById('add-target-btn').addEventListener('click', async () => {
    const input = document.getElementById('new-target-id');
    const tid = input.value.trim();

    if (!tid || !/^\d{17,20}$/.test(tid)) {
        input.classList.add('border-danger');
        return setTimeout(() => input.classList.remove('border-danger'), 1000);
    }

    try {
        const res = await fetch(`/api/add_target/${USER_ID}`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ target_id: tid, target_name: tid })
        });
        if (res.ok) {
            input.value = '';
            await loadTargets();
            CURRENT_TARGET = tid;
            window.location.hash = 'profile';
        } else {
            const err = await res.json();
            alert(err.detail);
        }
    } catch (e) { alert("Ошибка сервера"); }
});

window.removeTarget = async (tid) => {
    if (!confirm("Удалить цель?")) return;
    try {
        await fetch(`/api/remove_target/${USER_ID}/${tid}`, { method: 'DELETE' });
        if (CURRENT_TARGET === tid) CURRENT_TARGET = null;
        await loadTargets();
        window.location.hash = 'tracking';
    } catch (e) {}
};

function selectTarget(id) {
    CURRENT_TARGET = id;
    window.location.hash = 'profile';
}

const SUB_TABS = [
    { id: 'profile', label: 'Профиль', icon: 'profile' },
    { id: 'servers', label: 'Серверы', icon: 'server' },
    { id: 'nicks', label: 'Никнеймы', icon: 'tag' },
    { id: 'media', label: 'Медиа', icon: 'image' },
    { id: 'friends', label: 'Знакомые', icon: 'users' },
    { id: 'events', label: 'События', icon: 'cal' }
];

function render() {
    let hash = location.hash.slice(1) || 'feed';
    
    if (['profile', 'servers', 'nicks', 'media', 'friends', 'events'].includes(hash) && !CURRENT_TARGET) {
        if (userTargets.length > 0) {
            CURRENT_TARGET = userTargets[0].target_id;
        } else {
            hash = 'tracking';
            window.location.hash = 'tracking';
        }
    }

    document.getElementById('nav-feed').className = `flex h-9 items-center gap-2.5 rounded-lg px-3 text-sm font-medium transition-colors ${hash === 'feed' ? 'bg-[#1e1f22] text-tx' : 'text-mut hover:bg-[#1e1f22]/50 hover:text-tx'}`;
    document.getElementById('nav-tracking').className = `flex h-9 items-center gap-2.5 rounded-lg px-3 text-sm font-medium transition-colors ${hash === 'tracking' ? 'bg-[#1e1f22] text-tx' : 'text-mut hover:bg-[#1e1f22]/50 hover:text-tx'}`;

    const subMenuContainer = document.getElementById('sub-menu-container');
    if (['profile', 'servers', 'nicks', 'media', 'friends', 'events'].includes(hash) && CURRENT_TARGET) {
        subMenuContainer.classList.remove('hidden');
        const targetName = DATA.targets?.[CURRENT_TARGET]?.user?.display || userTargets.find(t => t.target_id === CURRENT_TARGET)?.target_name || CURRENT_TARGET;
        document.getElementById('selected-target-name').textContent = targetName;

        document.getElementById('sub-menu').innerHTML = SUB_TABS.map(t => {
            const isActive = t.id === hash;
            return `<a href="#${t.id}" class="flex h-9 items-center gap-2.5 rounded-lg px-3 text-sm transition-colors ${isActive ? 'bg-[#1e1f22] text-tx font-medium' : 'text-mut hover:bg-[#1e1f22]/50 hover:text-tx'}">
                ${icon(t.icon, `h-4 w-4 ${isActive ? 'text-accent' : 'text-mut'}`)} ${t.label}
            </a>`;
        }).join('');
    } else {
        subMenuContainer.classList.add('hidden');
    }

    const loader = document.getElementById('loader');
    const content = document.getElementById('content');
    loader.style.display = 'none';
    content.innerHTML = '';

    if (hash === 'feed') { content.innerHTML = renderFeed(); return; }
    if (hash === 'tracking') { content.innerHTML = renderTrackingList(); return; }

    const targetData = DATA.targets?.[CURRENT_TARGET];
    if (!targetData) {
        content.innerHTML = `<div class="flex h-[400px] flex-col items-center justify-center text-mut">
            <svg class="mb-3 h-6 w-6 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            <p class="text-sm">Ожидание данных от бота...</p>
        </div>`;
        return;
    }
    content.innerHTML = renderSubTab(hash, targetData);
}

function renderFeed() {
    const feed = DATA.global_feed || [];
    if (feed.length === 0) return renderEmpty('Лента пока пуста.');
    return `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        ${feed.map(f => `
        <div class="bg-panel/80 backdrop-blur-sm border border-line rounded-xl overflow-hidden flex flex-col group transition-transform hover:-translate-y-1 hover:border-accent/50">
            <div class="p-2.5 flex items-center gap-2 border-b border-line bg-[#141416]/90">
                <img src="${f.url}" class="w-6 h-6 rounded-full object-cover bg-bg">
                <span class="text-xs font-semibold truncate text-tx">${f.user}</span>
            </div>
            <div class="aspect-square bg-bg relative overflow-hidden cursor-pointer" onclick="openModal('${f.url}')">
                <img src="${f.url}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                <div class="absolute bottom-0 left-0 right-0 p-2 bg-gradient-to-t from-black/90 to-transparent flex justify-between items-center text-[10px] text-white/80 translate-y-full group-hover:translate-y-0 transition-transform duration-200">
                    <span class="bg-white/10 px-1.5 py-0.5 rounded">Развернуть</span>
                    <span>${formatDate(f.time)}</span>
                </div>
            </div>
        </div>`).join('')}
    </div>`;
}

function renderTrackingList() {
    if (userTargets.length === 0) return renderEmpty('Вы пока никого не отслеживаете.');
    return `<div class="flex flex-col gap-2">
        ${userTargets.map(t => {
            const userData = DATA.targets?.[t.target_id]?.user || {};
            const displayName = userData.display || t.target_name || t.target_id;
            const avatar = userData.avatar_url || avatarPlaceholder(displayName);
            const isOnline = DATA.targets?.[t.target_id]?.sessions?.some(s => s.dur === 'В сети');
            
            return `<div class="flex items-center justify-between p-3 rounded-xl bg-[#1e1f22]/80 backdrop-blur-sm border border-transparent hover:border-line transition cursor-pointer" onclick="selectTarget('${t.target_id}')">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <img src="${avatar}" class="w-10 h-10 rounded-full object-cover">
                        ${isOnline ? '<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-success border-2 border-[#1e1f22]"></span>' : ''}
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-tx">${displayName}</span>
                        <span class="text-[11px] text-mut font-mono">${t.target_id}</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-xs ${isOnline ? 'text-success' : 'text-mut'}">${isOnline ? 'В голосовом' : 'Не в голосовом'}</span>
                    <button onclick="event.stopPropagation(); removeTarget('${t.target_id}')" class="p-2 text-mut hover:text-danger hover:bg-danger/10 rounded-lg transition">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            </div>`;
        }).join('')}
    </div>`;
}

function renderSubTab(tabId, data) {
    switch (tabId) {
        case 'profile': return renderProfile(data);
        case 'servers': return renderServers(data);
        case 'nicks': return renderNicks(data);
        case 'media': return renderMedia(data);
        case 'friends': return renderFriends(data);
        case 'events': return renderEvents(data);
        default: return '';
    }
}

function renderProfile(data) {
    const u = data.user;
    const l = data.lastVoice || { server: '-', channel: '-', left: '-', icon: '' };
    const isNoVoice = l.server === '-' || !l.server;

    const row = (iconName, label, value) => `
        <div class="flex flex-col gap-1 border-b border-line/50 py-3 sm:flex-row sm:items-center">
            <span class="flex w-40 shrink-0 items-center gap-2 text-xs font-medium text-mut">
                ${icon(iconName, 'h-3.5 w-3.5')} ${label}
            </span>
            <span class="break-all text-sm font-medium text-tx">${value}</span>
        </div>`;

    let srvIcon = l.icon;
    if (!srvIcon && data.servers) {
        const foundSrv = data.servers.find(s => s.n === l.server);
        if (foundSrv) srvIcon = foundSrv.icon;
    }

    const srvLogo = srvIcon 
        ? `<img src="${srvIcon}" class="w-full h-full object-cover rounded-lg">` 
        : `<div class="w-full h-full flex items-center justify-center bg-line rounded-lg text-tx font-bold">${l.server ? l.server.charAt(0) : '#'}</div>`;

    return `
    <div class="grid gap-4 lg:grid-cols-3">
        <div class="flex flex-col gap-3 rounded-xl border border-line bg-panel/80 backdrop-blur-sm p-3">
            <div class="aspect-square w-full overflow-hidden rounded-lg border border-line bg-bg">
                <img src="${u.avatar_url || avatarPlaceholder(u.display)}" class="h-full w-full object-cover" onerror="this.src='${avatarPlaceholder(u.display)}'">
            </div>
            <div class="flex flex-col text-center">
                <h2 class="text-base font-bold text-tx truncate">${u.display}</h2>
                <p class="font-mono text-xs text-mut truncate">@${u.username}</p>
            </div>
        </div>
        
        <div class="flex flex-col rounded-xl border border-line bg-panel/80 backdrop-blur-sm px-4 py-2 lg:col-span-2">
            ${row('user', 'Username', `@${u.username}`)}
            ${row('id', 'Discord ID', `<span class="font-mono text-xs">${u.id}</span>`)}
            ${row('cal', 'Регистрация', formatDate(u.reg))}
            ${row('clock', 'Время в войсе', u.voice || '0ч 0м')}
        </div>

        <div class="rounded-xl border border-line bg-panel/80 backdrop-blur-sm p-4 lg:col-span-3 flex items-center gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl overflow-hidden border border-line/50 bg-bg">
                ${srvLogo}
            </div>
            <div class="min-w-0">
                <h4 class="text-xs font-semibold text-mut uppercase tracking-wider mb-1">Последняя сессия</h4>
                <div class="text-sm font-medium text-tx truncate">
                    ${isNoVoice ? 'Нет данных' : `${l.server} / ${l.channel}`}
                </div>
            </div>
            <div class="ml-auto text-xs text-mut text-right">
                ${isNoVoice ? '' : l.left}
            </div>
        </div>
    </div>`;
}

function renderServers(data) {
    const servers = data.servers || [];
    if (servers.length === 0) return renderEmpty('Нет общих серверов');
    return `<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        ${servers.map(s => {
            const serverIcon = s.icon 
                ? `<img src="${s.icon}" class="h-full w-full object-cover" onerror="this.src='${avatarPlaceholder(s.n)}'">` 
                : `<div class="flex h-full w-full items-center justify-center font-bold text-lg text-tx">${s.n.charAt(0).toUpperCase()}</div>`;

            return `
            <div class="flex items-center gap-4 rounded-xl bg-[#1e1f22]/80 backdrop-blur-sm p-3.5 hover:bg-[#25262b]/90 border border-transparent hover:border-line transition-colors">
                <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-line overflow-hidden border border-line/50">
                    ${serverIcon}
                </div>
                <div class="min-w-0">
                    <h4 class="truncate text-sm font-semibold text-tx">${s.n}</h4>
                    <div class="text-xs text-mut mt-1">Участников: ${s.m.toLocaleString('ru-RU')} · В голосе: ${s.v}</div>
                </div>
            </div>`;
        }).join('')}
    </div>`;
}

function renderNicks(data) {
    const nicks = data.nicks || [];
    if (nicks.length === 0) return renderEmpty('История никнеймов пуста');
    return `<div class="flex flex-col gap-2">
        ${nicks.map(n => `
        <div class="flex items-center justify-between p-3 rounded-xl bg-[#1e1f22]/80 backdrop-blur-sm border border-transparent hover:border-line/50 transition-colors">
            <div class="flex-1 text-sm font-medium text-tx">${n[0]}</div>
            <div class="flex-1 text-xs text-mut">${n[1]}</div>
            <div class="flex-1 text-right font-mono text-xs text-mut">${formatDate(n[2])}</div>
        </div>`).join('')}
    </div>`;
}

function renderMedia(data) {
    const media = data.media || [];
    if (media.length === 0) return renderEmpty('Нет аватарок');
    return `<div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
        ${media.map(m => {
            const isUrl = m.s && m.s.startsWith('http');
            return `<div class="aspect-square overflow-hidden rounded-xl border border-line bg-panel cursor-pointer hover:border-accent/60 transition-colors" onclick="openModal('${isUrl ? m.s : ''}')">
                <img src="${isUrl ? m.s : avatarPlaceholder('?')}" class="h-full w-full object-cover" loading="lazy" onerror="this.src='${avatarPlaceholder('?')}'">
            </div>`;
        }).join('')}
    </div>`;
}

function renderFriends(data) {
    const friends = data.friends || [];
    if (friends.length === 0) return renderEmpty('Нет совместных сессий');
    return `<div class="flex flex-col gap-2">
        ${friends.map(f => {
            const avatar = f.avatar || avatarPlaceholder(f.u);
            return `
            <div class="flex items-center justify-between p-3 rounded-xl bg-[#1e1f22]/80 backdrop-blur-sm border border-transparent hover:border-line/50 transition-colors">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <img src="${avatar}" class="w-8 h-8 rounded-full object-cover shrink-0" onerror="this.src='${avatarPlaceholder(f.u)}'">
                    <span class="text-sm font-medium text-tx truncate">${f.u}</span>
                </div>
                <div class="flex-1 text-xs text-mut">${formatMinutes(f.min)}</div>
                <div class="flex-1 text-right font-mono text-xs text-mut">${f.last}</div>
            </div>`;
        }).join('')}
    </div>`;
}

function renderEvents(data) {
    let sessions = data.sessions || [];
    if (sessions.length === 0) return renderEmpty('История сессий пуста');

    let hasOnline = false;
    sessions = sessions.filter(s => {
        if (s.dur === 'В сети') {
            if (hasOnline) return false;
            hasOnline = true;
        }
        return true;
    });

    return `<div class="flex flex-col gap-2">
        ${sessions.map(s => {
            let srvIcon = s.srv_icon;
            if (!srvIcon && data.servers) {
                const foundSrv = data.servers.find(serv => serv.n === s.srv);
                if (foundSrv) srvIcon = foundSrv.icon;
            }

            const srvLogo = srvIcon 
                ? `<img src="${srvIcon}" class="w-6 h-6 rounded-md object-cover">` 
                : `<div class="w-6 h-6 rounded-md bg-line flex items-center justify-center text-[10px] font-bold text-tx">${s.srv.charAt(0)}</div>`;

            return `
            <div class="flex items-center justify-between p-3 rounded-xl bg-[#1e1f22]/80 backdrop-blur-sm border border-transparent hover:border-line/50 transition-colors">
                <div class="flex items-center gap-3 flex-1">
                    ${srvLogo}
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-tx">${s.srv}</span>
                        <span class="text-[11px] text-mut"># ${s.ch}</span>
                    </div>
                </div>
                <div class="flex-1 text-sm font-mono ${s.dur === 'В сети' ? 'text-success font-bold' : 'text-mut'}">${s.dur}</div>
                <div class="flex-1 text-right text-xs font-mono text-mut">${s.per}</div>
            </div>`;
        }).join('')}
    </div>`;
}

function renderEmpty(msg) {
    return `<div class="flex h-64 items-center justify-center rounded-xl border border-dashed border-line bg-panel/30">
        <p class="text-sm text-mut">${msg}</p>
    </div>`;
}

async function loadData() {
    if (!USER_ID) return;
    try {
        const res = await fetch('/api/data');
        DATA = await res.json();
        render();
    } catch (e) {}
}

window.openModal = (url) => {
    if (!url) return;
    const modal = document.getElementById('image-modal');
    const img = document.getElementById('modal-img');
    img.src = url;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
};

window.addEventListener('hashchange', render);
checkAuth();
</script>
</body>
</html>
