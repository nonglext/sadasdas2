<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{
  colors:{bg:'#0d0e12',panel:'#15161c',panel2:'#1b1d24',line:'#262833',tx:'#e6e8ee',mut:'#8a8fa0',acc:'#6c74ff',acc2:'#9b5cff',ok:'#3ddc97',bad:'#ff5c7a'},
  fontFamily:{sans:['Inter','system-ui','sans-serif'],display:['Manrope','Inter','sans-serif'],mono:['"JetBrains Mono"','ui-monospace','monospace']},
  boxShadow:{glow:'0 0 0 1px rgba(108,116,255,.35),0 8px 28px -10px rgba(108,116,255,.6)'}
}}}
</script>
<style type="text/tailwindcss">
@layer components{
  .inp{@apply w-full h-10 px-3 rounded-lg bg-bg/80 border border-line text-tx placeholder:text-mut/60 outline-none transition focus:border-acc focus:ring-4 focus:ring-acc/15;}
  .btn-p{@apply h-10 px-4 rounded-lg bg-gradient-to-b from-[#7a81ff] to-acc text-white font-semibold transition hover:brightness-110 active:scale-[.98] shadow-glow disabled:opacity-60 disabled:pointer-events-none;}
  .card{@apply bg-panel/90 border border-line rounded-xl;}
  .lbl{@apply text-[11px] font-semibold uppercase tracking-[.08em] text-mut;}
  .logo{@apply rounded-xl bg-gradient-to-br from-acc to-acc2 grid place-items-center text-white font-display font-extrabold shadow-glow;}
  .th{@apply px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-[.06em] text-mut bg-panel2 sticky top-0;}
  .td{@apply px-4 py-3;}
}
</style>
<style>
:root{color-scheme:dark}
html,body{background:#0d0e12}
body{margin:0;font-family:Inter,system-ui,sans-serif;font-size:14px;color:#e6e8ee;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 520px at 8% -12%,rgba(108,116,255,.16),transparent 60%),radial-gradient(700px 420px at 105% -5%,rgba(155,92,255,.08),transparent 60%)}
#app-screen{position:relative}
*{scrollbar-width:thin;scrollbar-color:#2c2f3b transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c2f3b;border-radius:8px}
tbody tr{transition:background .15s}tbody tr:hover{background:rgba(255,255,255,.025)}
.view{animation:in .25s cubic-bezier(.2,.7,.2,1)}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.skel{background:linear-gradient(90deg,#17181f 0%,#20222b 50%,#17181f 100%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc97;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pl 2s infinite}
.dot.off{background:#8a8fa0;animation:none;box-shadow:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.toast{animation:tin .25s ease-out}.toast.out{opacity:0;transform:translateY(6px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.media-tile img{transition:transform .35s cubic-bezier(.2,.7,.2,1)}.media-tile:hover img{transform:scale(1.06)}
</style>
</head>
<body>

<!-- Тосты -->
<div id="toasts" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 pointer-events-none"></div>

<!-- Экран авторизации -->
<div id="auth-screen" class="fixed inset-0 bg-bg z-50 flex items-center justify-center p-4 hidden">
  <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(560px 380px at 50% 28%,rgba(108,116,255,.2),transparent 70%)"></div>
  <div class="relative w-full max-w-sm">
    <div class="flex flex-col items-center mb-6 text-center">
      <div class="logo w-12 h-12 text-lg mb-4">T</div>
      <h2 class="font-display text-2xl font-extrabold tracking-tight" id="auth-title">Вход</h2>
      <p class="text-mut text-sm mt-1" id="auth-sub">С возвращением в Tracker</p>
    </div>
    <div class="card p-6 shadow-2xl shadow-black/50">
      <form id="auth-form" class="flex flex-col gap-3">
        <label class="flex flex-col gap-1.5"><span class="lbl">Логин</span>
          <input type="text" id="auth-user" autocomplete="username" placeholder="username" class="inp" required></label>
        <label class="flex flex-col gap-1.5"><span class="lbl">Пароль</span>
          <input type="password" id="auth-pass" autocomplete="current-password" placeholder="••••••••" class="inp" required></label>
        <label class="flex-col gap-1.5 hidden" id="auth-confirm-wrap"><span class="lbl">Повторите пароль</span>
          <input type="password" id="auth-confirm" autocomplete="new-password" placeholder="••••••••" class="inp"></label>
        <div id="auth-error" class="hidden text-sm text-[#ffb3c1] bg-bad/10 border border-bad/30 rounded-lg px-3 py-2"></div>
        <button type="submit" class="btn-p mt-2" id="auth-btn">Войти</button>
      </form>
    </div>
    <div class="text-center mt-5 text-sm text-mut">
      <span id="auth-switch-text">Нет аккаунта?</span>
      <button type="button" id="auth-switch" class="text-acc hover:text-[#9aa0ff] font-semibold ml-1 transition">Зарегистрироваться</button>
    </div>
  </div>
</div>

<!-- Основной дашборд -->
<div id="app-screen" class="hidden">
  <nav class="sticky top-0 z-20 bg-bg/70 backdrop-blur-xl border-b border-line/70">
    <div class="max-w-[1240px] mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5"><div class="logo w-7 h-7 text-xs rounded-lg">T</div><span class="font-display text-[17px] font-extrabold tracking-tight">Tracker</span></div>
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center gap-2 text-xs text-mut px-3 h-8 rounded-lg border border-line bg-panel/60"><span id="sync-dot" class="dot off"></span><span id="sync-text">Подключение…</span></div>
        <div class="flex items-center gap-2 pl-1 pr-3 h-8 rounded-lg border border-line bg-panel/60 max-w-[180px]"><img id="me-av" class="w-6 h-6 rounded-md" alt=""><span class="text-sm font-medium truncate" id="current-user-display"></span></div>
        <button id="logout-btn" title="Выйти" class="h-8 px-2.5 rounded-lg text-sm font-semibold text-bad/90 hover:text-bad hover:bg-bad/10 border border-transparent hover:border-bad/25 transition flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="hidden sm:inline">Выйти</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-[1240px] mx-auto px-4 py-5 grid gap-4 md:grid-cols-[264px_1fr] items-start">
    <aside class="card p-3 md:sticky md:top-[72px] flex flex-col gap-4">
      <div class="rounded-lg bg-panel2/70 border border-line p-3">
        <div class="lbl mb-2.5">Добавить цель</div>
        <div class="flex flex-col gap-2">
          <input type="text" id="new-target-id" inputmode="numeric" placeholder="Discord ID" class="inp h-9 font-mono text-[13px]">
          <input type="text" id="new-target-name" placeholder="Имя (для себя)" class="inp h-9 text-[13px]">
          <button id="add-target-btn" class="btn-p h-9 text-[13px] flex items-center justify-center gap-1.5">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="w-3.5 h-3.5"><path d="M12 5v14M5 12h14"/></svg>Добавить
          </button>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2 px-1"><span class="lbl">Мои цели</span><span id="target-count" class="text-[11px] text-mut font-mono"></span></div>
        <div id="target-list" class="flex flex-col gap-1 max-h-60 overflow-y-auto -mr-1 pr-1"></div>
      </div>

      <div class="border-t border-line pt-3">
        <div class="hidden md:block lbl px-1 mb-2 truncate" id="sbName">Выберите цель</div>
        <div id="menu" class="flex md:flex-col gap-1 overflow-x-auto -mx-1 px-1 pb-1 md:pb-0"></div>
      </div>
    </aside>

    <main id="view" class="min-w-0">
      <div id="loader" class="flex flex-col gap-4">
        <div class="skel h-20"></div>
        <div class="grid gap-4 lg:grid-cols-[280px_1fr]"><div class="skel aspect-square"></div><div class="flex flex-col gap-4"><div class="grid gap-3 sm:grid-cols-3"><div class="skel h-20"></div><div class="skel h-20"></div><div class="skel h-20"></div></div><div class="skel h-44"></div></div></div>
      </div>
    </main>
  </div>
</div>

<script>
let DATA = {}, CURRENT_TARGET = null, USER_ID = null, POLL = null, LAST = '';
const P={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',server:'<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/>',tag:'<path d="M20 12 12 20 3 11V3h8z"/><circle cx="7.5" cy="7.5" r="1"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4.500a3.500 3.500 0 0 1 0 7M22 21c0-3-2-5-4-5.500"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',hash:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
const ic=(n,c='w-4 h-4')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${c} shrink-0">${P[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=(s)=>{s=String(s||'?');let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="hsl(${h},60%,52%)"/><stop offset="1" stop-color="hsl(${(h+50)%360},62%,26%)"/></linearGradient></defs><rect width="64" height="64" fill="url(#g)"/><text x="32" y="43" font-size="30" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#fff" fill-opacity=".9">${esc((s[0]||'?').toUpperCase())}</text></svg>`)};
const img=(src,name,cls)=>`<img src="${esc(src||av(name))}" data-fb="${esc(av(name))}" onerror="this.onerror=null;this.src=this.dataset.fb" class="${cls}" alt="" loading="lazy">`;
const fmtMin=m=>Math.floor(m/60)+'ч '+(m%60)+'м';
const fmtDate=s=>{if(!s) return '';const d=new Date(s);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+' в '+p(d.getHours())+':'+p(d.getMinutes())};
const card='card';
const TABS=[['profile','Профиль','user'],['servers','Серверы','server'],['nicks','Никнеймы','tag'],['media','Медиа','image'],['friends','Знакомые','users'],['events','События','cal']];
const T=()=>DATA.targets?.[CURRENT_TARGET];
const empty=(i,t,s='')=>`<div class="card py-16 px-6 text-center flex flex-col items-center"><div class="w-12 h-12 rounded-xl bg-panel2 border border-line grid place-items-center text-mut mb-4">${ic(i,'w-5 h-5')}</div><div class="font-display font-bold text-base">${t}</div>${s?`<div class="text-mut text-sm mt-1 max-w-xs">${s}</div>`:''}</div>`;
const pending=()=>empty('clock','Данных пока нет','Страница обновляется каждые 10 секунд');

function toast(msg,type='err'){const w=document.getElementById('toasts');const el=document.createElement('div');
  el.className=`toast pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border bg-panel2 text-sm shadow-2xl shadow-black/50 ${type==='ok'?'border-ok/30 text-ok':'border-bad/30 text-[#ffb3c1]'}`;
  el.textContent=msg;w.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},3200)}

// === АВТОРИЗАЦИЯ ===
let isRegistering = false;
const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const authForm = document.getElementById('auth-form');
const confirmField = document.getElementById('auth-confirm');
const confirmWrap = document.getElementById('auth-confirm-wrap');
const authErr = document.getElementById('auth-error');
const showAuthErr = m => { authErr.textContent = m; authErr.classList.toggle('hidden', !m); };

document.getElementById('auth-switch').addEventListener('click', () => {
  isRegistering = !isRegistering;
  document.getElementById('auth-title').textContent = isRegistering ? 'Регистрация' : 'Вход';
  document.getElementById('auth-sub').textContent = isRegistering ? 'Создайте аккаунт за минуту' : 'С возвращением в Tracker';
  document.getElementById('auth-btn').textContent = isRegistering ? 'Создать аккаунт' : 'Войти';
  document.getElementById('auth-switch-text').textContent = isRegistering ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
  document.getElementById('auth-switch').textContent = isRegistering ? 'Войти' : 'Зарегистрироваться';
  confirmWrap.classList.toggle('hidden', !isRegistering);
  confirmWrap.classList.toggle('flex', isRegistering);
  confirmField.required = isRegistering; // скрытое required-поле блокировало вход
  document.getElementById('auth-pass').autocomplete = isRegistering ? 'new-password' : 'current-password';
  showAuthErr('');
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = document.getElementById('auth-user').value.trim();
  const p = document.getElementById('auth-pass').value;
  const c = confirmField.value;
  if (isRegistering && p !== c) return showAuthErr('Пароли не совпадают');
  const btn = document.getElementById('auth-btn'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Подождите…'; showAuthErr('');
  try {
    const res = await fetch(isRegistering ? '/api/register' : '/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('user_id', data.user_id);
      localStorage.setItem('username', data.username);
      authForm.reset();
      checkAuth();
    } else showAuthErr(data.detail || 'Ошибка');
  } catch(e) { showAuthErr('Сервер недоступен'); }
  finally { btn.disabled = false; btn.textContent = label; }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.clear(); clearInterval(POLL); POLL = null;
  DATA = {}; LAST = ''; CURRENT_TARGET = null; userTargets = [];
  checkAuth();
});

function checkAuth() {
  USER_ID = localStorage.getItem('user_id');
  if (USER_ID) {
    const name = localStorage.getItem('username') || '';
    document.getElementById('current-user-display').textContent = name;
    document.getElementById('me-av').src = av(name);
    authScreen.classList.add('hidden'); appScreen.classList.remove('hidden');
    loadTargets().then(loadData);
    if (!POLL) POLL = setInterval(loadData, 10000); // автообновление раз в 10 сек
  } else {
    authScreen.classList.remove('hidden'); appScreen.classList.add('hidden');
  }
}

// === УПРАВЛЕНИЕ ЦЕЛЯМИ ===
let userTargets = [];

async function loadTargets() {
  if (!USER_ID) return;
  try {
    const res = await fetch(`/api/my_targets/${USER_ID}`);
    userTargets = await res.json();
    if (!CURRENT_TARGET && userTargets.length) {
      const saved = localStorage.getItem('target');
      CURRENT_TARGET = userTargets.some(t => t.target_id === saved) ? saved : userTargets[0].target_id;
      setSbName();
    }
    renderTargetList();
  } catch(e) {}
}

function setSbName() {
  document.getElementById('sbName').textContent = userTargets.find(t => t.target_id === CURRENT_TARGET)?.target_name || 'Выберите цель';
}

function renderTargetList() {
  document.getElementById('target-count').textContent = userTargets.length || '';
  const list = document.getElementById('target-list');
  if (!userTargets.length) { list.innerHTML = '<div class="text-xs text-mut px-1 py-2">Пока пусто</div>'; return; }
  list.innerHTML = userTargets.map(t => {
    const a = CURRENT_TARGET === t.target_id;
    const online = DATA.targets?.[t.target_id]?.sessions?.some(s => s.dur === 'В сети');
    return `<div data-id="${esc(t.target_id)}" title="${esc(t.target_id)}" class="group flex items-center gap-2.5 px-2 py-1.5 rounded-lg border cursor-pointer transition ${a ? 'bg-acc/15 border-acc/40' : 'border-transparent hover:bg-white/[.04]'}">
      <div class="relative shrink-0">${img(DATA.targets?.[t.target_id]?.user?.avatar_url, t.target_name, 'w-7 h-7 rounded-md object-cover')}${online ? '<span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-ok ring-2 ring-panel"></span>' : ''}</div>
      <span class="text-[13.5px] font-medium truncate flex-1 ${a ? 'text-white' : ''}">${esc(t.target_name)}</span>
      <button data-del="${esc(t.target_id)}" title="Удалить" class="w-6 h-6 grid place-items-center rounded-md text-mut hover:text-bad hover:bg-bad/10 opacity-0 group-hover:opacity-100 focus:opacity-100 transition">${ic('x','w-3.5 h-3.5')}</button>
    </div>`;
  }).join('');
}

document.getElementById('target-list').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); removeTarget(del.dataset.del); return; }
  const it = e.target.closest('[data-id]');
  if (it) selectTarget(it.dataset.id);
});

function selectTarget(id) {
  CURRENT_TARGET = id;
  localStorage.setItem('target', id);
  renderTargetList(); setSbName(); render();
}

async function addTarget() {
  const tid = document.getElementById('new-target-id').value.trim();
  const tname = document.getElementById('new-target-name').value.trim() || tid;
  if (!tid) return toast('Введите Discord ID');
  const btn = document.getElementById('add-target-btn'); btn.disabled = true;
  try {
    const res = await fetch(`/api/add_target/${USER_ID}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target_id: tid, target_name: tname})
    });
    if (res.ok) {
      document.getElementById('new-target-id').value = '';
      document.getElementById('new-target-name').value = '';
      await loadTargets();
      selectTarget(tid);
      toast('Цель добавлена', 'ok');
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.detail || 'Не удалось добавить');
    }
  } catch(e) { toast('Ошибка сервера'); }
  finally { btn.disabled = false; }
}
document.getElementById('add-target-btn').addEventListener('click', addTarget);
['new-target-id','new-target-name'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') addTarget(); }));

window.removeTarget = async (tid) => {
  if (!confirm('Удалить эту цель?')) return;
  try {
    await fetch(`/api/remove_target/${USER_ID}/${tid}`, {method: 'DELETE'});
    if (CURRENT_TARGET === tid) { CURRENT_TARGET = null; localStorage.removeItem('target'); }
    await loadTargets();
    if (CURRENT_TARGET) selectTarget(CURRENT_TARGET); else { setSbName(); render(); }
  } catch(e) { toast('Ошибка сервера'); }
};

window.copyId = (id) => { navigator.clipboard?.writeText(id).then(() => toast('ID скопирован', 'ok')).catch(() => {}); };

// === ОТОБРАЖЕНИЕ ДАННЫХ ===
function head() {
  const t = userTargets.find(x => x.target_id === CURRENT_TARGET), d = T(), u = d?.user || {};
  const name = t?.target_name || u.display || CURRENT_TARGET;
  const online = d?.sessions?.find(s => s.dur === 'В сети');
  return `<div class="card p-4 mb-4 flex items-center gap-4 relative overflow-hidden">
    <div class="absolute inset-y-0 left-0 w-1 bg-gradient-to-b from-acc to-acc2"></div>
    <div class="relative shrink-0">${img(u.avatar_url, name, 'w-12 h-12 rounded-xl object-cover border border-line')}${online ? '<span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 rounded-full bg-ok ring-[3px] ring-panel"></span>' : ''}</div>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2 flex-wrap"><h1 class="font-display text-xl font-extrabold tracking-tight truncate">${esc(name)}</h1>
        ${online ? `<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-ok bg-ok/10 border border-ok/25 rounded-full px-2 py-0.5"><span class="dot"></span>В войсе · ${esc(online.srv)}</span>` : ''}</div>
      <button onclick="copyId('${esc(CURRENT_TARGET)}')" class="mt-0.5 inline-flex items-center gap-1.5 text-xs text-mut hover:text-tx font-mono transition">${esc(CURRENT_TARGET)}${ic('copy','w-3 h-3')}</button>
    </div>
  </div>`;
}

function render(anim = true) {
  const h = location.hash.slice(1); const tab = V[h] ? h : 'profile';
  const d = T();
  const cnt = {servers: d?.servers?.length, nicks: d?.nicks?.length, media: d?.media?.length, friends: d?.friends?.length, events: d?.sessions?.length};
  document.getElementById('menu').innerHTML = TABS.map(([k, n, i]) => {
    const a = k === tab, c = cnt[k];
    return `<a href="#${k}" class="relative flex items-center gap-2.5 px-3 h-9 rounded-lg whitespace-nowrap text-[13.5px] transition ${a ? 'bg-acc/15 text-white font-semibold' : 'text-mut hover:text-tx hover:bg-white/[.04]'}">${a ? '<span class="absolute left-0 top-2 bottom-2 w-[3px] rounded-r bg-acc hidden md:block"></span>' : ''}${ic(i)}<span class="flex-1">${n}</span>${c ? `<span class="text-[11px] font-mono px-1.5 rounded-md ${a ? 'bg-acc/30 text-white' : 'bg-white/5 text-mut'}">${c}</span>` : ''}</a>`;
  }).join('');
  const v = document.getElementById('view');
  if (!CURRENT_TARGET) { v.innerHTML = empty('users', userTargets.length ? 'Выберите цель' : 'Добавьте первую цель', 'Введите Discord ID в панели слева'); return; }
  v.innerHTML = head() + `<div class="${anim ? 'view' : ''}">${V[tab]()}</div>`;
}

async function loadData() {
  if (!USER_ID) return;
  const dot = document.getElementById('sync-dot'), txt = document.getElementById('sync-text');
  try {
    const res = await fetch('/api/data');
    const raw = await res.text();
    dot.classList.remove('off');
    txt.textContent = 'Обновлено ' + new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    if (raw === LAST && !document.getElementById('loader')) return; // ничего не изменилось
    LAST = raw; DATA = JSON.parse(raw);
    document.getElementById('loader')?.remove(); // раньше падало после первого рендера и ломало автообновление
    renderTargetList(); render(false);
  } catch (e) {
    dot.classList.add('off'); txt.textContent = 'Нет связи';
    if (document.getElementById('loader')) render();
  }
}

const V = {
profile(){ const d = T(); if (!d) return pending(); const u = d.user || {}, l = d.lastVoice || {};
  const stat = (i, k, v) => `<div class="card p-4"><div class="flex items-center gap-2 text-mut text-xs font-medium">${ic(i,'w-3.5 h-3.5')}${k}</div><div class="font-display text-xl font-bold mt-2 tabular-nums truncate">${esc(v ?? '—')}</div></div>`;
  const row = (k, v, mono) => `<div class="flex items-center justify-between gap-4 py-3"><span class="text-mut shrink-0">${k}</span><span class="font-medium text-right break-all ${mono ? 'font-mono text-[13px]' : ''}">${esc(v || '—')}</span></div>`;
  return `<div class="grid gap-4 lg:grid-cols-[280px_1fr]">
    <div class="card p-3 self-start">
      ${img(u.avatar_url, u.display, 'w-full aspect-square rounded-lg object-cover bg-panel2')}
      <div class="px-1 pt-3 pb-1"><div class="font-display text-lg font-bold truncate">${esc(u.display || '—')}</div><div class="text-mut text-sm truncate">@${esc(u.username || '—')}</div></div>
    </div>
    <div class="flex flex-col gap-4 min-w-0">
      <div class="grid gap-3 sm:grid-cols-3">${stat('clock','Всего в войсе',u.voice)}${stat('eye','Просмотров',u.views)}${stat('cal','Регистрация',u.reg)}</div>
      <div class="grid gap-4 xl:grid-cols-[1fr_300px]">
        <div class="card px-4 py-1 divide-y divide-line">${row('Username',u.username)}${row('Display Name',u.display)}${row('Discord ID',u.id,1)}</div>
        <div class="card p-4 relative overflow-hidden">
          <div class="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-acc/15 blur-2xl pointer-events-none"></div>
          <div class="lbl mb-3">Последний голосовой</div>
          <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-lg bg-acc/15 text-acc grid place-items-center">${ic('mic','w-5 h-5')}</div>
            <div class="min-w-0"><div class="font-semibold truncate">${esc(l.server || '—')}</div><div class="text-mut text-sm truncate"># ${esc(l.channel || '—')}</div></div></div>
          <div class="mt-4 pt-3 border-t border-line text-xs text-mut flex items-center gap-1.5">${ic('clock','w-3.5 h-3.5')}Вышел: <span class="text-tx">${esc(l.left || '—')}</span></div>
        </div>
      </div>
    </div>
  </div>`},

servers(){ const srv = T()?.servers; if (!srv || !srv.length) return empty('server','Общих серверов не найдено');
  return `<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">${srv.map(s => `<div class="card p-3.5 flex items-center gap-3 hover:border-acc/40 transition">
    ${img(null, s.n, 'w-12 h-12 rounded-xl shrink-0')}
    <div class="min-w-0"><div class="font-semibold truncate">${esc(s.n)}</div>
      <div class="flex items-center gap-3 text-mut text-[13px] mt-1">
        <span class="flex items-center gap-1">${ic('users','w-3.5 h-3.5')}${Number(s.m || 0).toLocaleString('ru-RU')}</span>
        <span class="flex items-center gap-1 ${s.v > 0 ? 'text-ok' : ''}">${ic('mic','w-3.5 h-3.5')}${esc(s.v)} в голосе</span>
      </div></div></div>`).join('')}</div>`},

nicks(){ const nicks = T()?.nicks; if (!nicks || !nicks.length) return empty('tag','Нет записей','Смены никнеймов появятся здесь');
  return `<div class="card overflow-auto max-h-[70vh]"><table class="w-full min-w-[560px] text-[13.5px]"><thead><tr><th class="th">Никнейм</th><th class="th">Сервер</th><th class="th text-right">Дата ↓</th></tr></thead><tbody>${nicks.map(r => `<tr class="border-t border-line"><td class="td font-semibold">${esc(r[0])}</td><td class="td text-mut">${esc(r[1])}</td><td class="td text-right text-mut font-mono text-[12.5px] tabular-nums">${fmtDate(r[2])}</td></tr>`).join('')}</tbody></table></div>`},

media(){ const media = T()?.media; if (!media || !media.length) return empty('image','История аватарок пуста');
  return `<div class="grid gap-2.5 grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7">${media.map((m, i) => { const isUrl = m.s && m.s.startsWith('http');
    return `<a ${isUrl ? `href="${esc(m.s)}" target="_blank" rel="noopener"` : ''} class="media-tile group relative aspect-square rounded-xl overflow-hidden border border-line bg-panel hover:border-acc/50 transition">
      ${img(isUrl ? m.s : null, '?', 'w-full h-full object-cover')}
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition flex items-end justify-between p-2 text-[11px] font-mono text-white/90"><span>#${media.length - i}</span>${isUrl ? ic('ext','w-3.5 h-3.5') : ''}</div>
    </a>`}).join('')}</div>`},

friends(){ const friends = T()?.friends; if (!friends || !friends.length) return empty('users','Список знакомых пуст');
  const max = Math.max(...friends.map(f => f.min || 0), 1);
  return `<div class="card overflow-x-auto"><table class="w-full min-w-[560px] text-[13.5px]"><thead><tr><th class="th">Пользователь</th><th class="th w-[40%]">Провели вместе</th><th class="th text-right">Последний раз</th></tr></thead><tbody>${friends.map(f => `<tr class="border-t border-line">
    <td class="td"><div class="flex items-center gap-3">${img(null, f.u, 'w-9 h-9 rounded-full shrink-0')}<span class="font-semibold truncate">${esc(f.u)}</span></div></td>
    <td class="td"><div class="flex items-center gap-3"><div class="flex-1 h-1.5 rounded-full bg-white/5 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-acc to-acc2" style="width:${Math.max(4, Math.round((f.min || 0) / max * 100))}%"></div></div><span class="font-mono text-[12.5px] tabular-nums w-16 text-right">${fmtMin(f.min || 0)}</span></div></td>
    <td class="td text-right text-mut tabular-nums">${esc(f.last)}</td></tr>`).join('')}</tbody></table></div>`},

events(){ const sessions = T()?.sessions; if (!sessions || !sessions.length) return empty('cal','Записей о голосовых сессиях нет');
  return `<div class="card overflow-auto max-h-[70vh]"><table class="w-full min-w-[620px] text-[13.5px]"><thead><tr><th class="th">Сервер</th><th class="th">Канал</th><th class="th">Длительность</th><th class="th text-right">Период ↓</th></tr></thead><tbody>${sessions.map(s => { const on = s.dur === 'В сети';
    return `<tr class="border-t border-line ${on ? 'bg-ok/[.04]' : ''}"><td class="td"><div class="flex items-center gap-2.5">${img(null, s.srv, 'w-6 h-6 rounded-md shrink-0')}<span class="font-medium truncate">${esc(s.srv)}</span></div></td>
    <td class="td text-mut"><span class="inline-flex items-center gap-1">${ic('hash','w-3.5 h-3.5')}${esc(s.ch)}</span></td>
    <td class="td">${on ? '<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-ok bg-ok/10 border border-ok/25 rounded-full px-2 py-0.5"><span class="dot"></span>В сети</span>' : `<span class="font-semibold tabular-nums">${esc(s.dur)}</span>`}</td>
    <td class="td text-right text-mut font-mono text-[12.5px] tabular-nums">${esc(s.per)}</td></tr>`}).join('')}</tbody></table></div>`}
};

window.addEventListener('hashchange', () => render());
checkAuth();
</script>
