<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XIVIVIDE Monitor</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: {
    sans: ['"Onest"', 'system-ui', 'sans-serif'],
    mono: ['"JetBrains Mono"', 'monospace'] } } } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080b;--sf:rgba(16,16,21,.72);--hair:rgba(255,255,255,.075);--hair2:rgba(255,255,255,.14);--tx:#ededf2;--mut:#8d8d9b;--ac:#8b7bff;--ok:#3ddc97;--bad:#ff6b7a;color-scheme:dark}
*{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-feature-settings:"tnum","ss01";}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60vmax 60vmax at 50% 50%,rgba(139,123,255,.085),transparent 62%)}
.bgx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bgx line{stroke:rgba(255,255,255,.055);stroke-width:1;vector-effect:non-scaling-stroke}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#26262e;border-radius:3px}
::selection{background:rgba(139,123,255,.35)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.disp{font-family:"Unbounded","Onest",sans-serif;font-weight:500;letter-spacing:-.01em}
.t-mut{color:var(--mut)}.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}
.sf{background:var(--sf);border:1px solid var(--hair);border-radius:18px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 24px 48px -28px rgba(0,0,0,.8)}
.list{overflow:hidden;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;transition:background .15s}
.row+.row{border-top:1px solid var(--hair)}
.row:hover{background:rgba(255,255,255,.028)}
.row.click{cursor:pointer}
.field{height:40px;width:100%;border-radius:11px;border:1px solid var(--hair);background:rgba(255,255,255,.03);padding:0 14px;font-size:14px;color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.field::placeholder{color:#5f5f6d}
.field:focus{border-color:rgba(139,123,255,.6);background:rgba(255,255,255,.045);box-shadow:0 0 0 4px rgba(139,123,255,.14)}
.field.err{border-color:var(--bad);box-shadow:0 0 0 4px rgba(255,107,122,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:11px;background:var(--tx);color:#0a0a0d;font-size:14px;font-weight:600;transition:background .15s,transform .1s;flex-shrink:0}
.btn:hover{background:#fff}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--tx)}.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.bad{background:var(--bad);color:#1a0508}
.addbox{display:flex;align-items:center;gap:4px;height:40px;width:100%;padding:3px;border-radius:13px;border:1px solid var(--hair);background:rgba(255,255,255,.03);transition:border-color .15s,box-shadow .15s}
.addbox:focus-within{border-color:rgba(139,123,255,.6);box-shadow:0 0 0 4px rgba(139,123,255,.14)}
.addbox input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;padding:0 10px;font-size:14px;color:var(--tx)}
.addbox input::placeholder{color:#5f5f6d}.addbox input.err{color:var(--bad)}
.addbox .btn{height:100%;border-radius:10px;padding:0 14px}
.na{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap;transition:background .15s,color .15s}
.na:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.na.on{color:var(--tx);background:rgba(255,255,255,.065)}
.na.on svg{color:var(--ac)}
.na.on::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--ac)}
.ph{margin-bottom:22px}.ph h1{font-family:"Unbounded",sans-serif;font-weight:500;font-size:24px;letter-spacing:-.02em}.ph p{margin-top:6px;font-size:14px;color:var(--mut)}
.ava{border-radius:999px;object-fit:cover;background:#14141a;flex-shrink:0}
.live{position:relative;display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--ok);flex-shrink:0}
.live::after{content:"";position:absolute;inset:-4px;border-radius:99px;border:1px solid var(--ok);opacity:0;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;cursor:pointer;background:#101015;border:1px solid var(--hair);transition:border-color .2s}
.tile:hover{border-color:var(--hair2)}
.tile>img.pic{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.tile:hover>img.pic{transform:scale(1.045)}
.cap{position:absolute;inset:auto 0 0 0;display:flex;align-items:center;gap:8px;padding:28px 10px 10px;background:linear-gradient(to top,rgba(0,0,0,.78),transparent);font-size:12px}
.cap b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cap span{color:rgba(255,255,255,.66);white-space:nowrap}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--ac)}
.rail{position:relative;width:9px;height:9px;border-radius:9px;border:2px solid #4a4a58;flex-shrink:0}
.rail.first{border-color:var(--ac)}
.fade-in{animation:fi .25s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.rv{animation:rv .8s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
@keyframes rv{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ov{position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:16px;background:rgba(4,4,7,.78);backdrop-filter:blur(10px);animation:fi .15s both}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:200;opacity:0;pointer-events:none;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;background:#1b1b23;border:1px solid var(--hair2);box-shadow:0 16px 40px rgba(0,0,0,.6);transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="h-full font-sans antialiased relative">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M80 20L20 80" stroke="#000" stroke-width="24" stroke-linecap="round"/></mask></defs>
  <symbol id="xm" viewBox="0 0 100 100"><path d="M20 20L80 80" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" mask="url(#mk)"/><path d="M80 20L20 80" fill="none" style="stroke:var(--ac)" stroke-width="11" stroke-linecap="round"/></symbol>
</svg>

<svg class="bgx" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></svg>

<div id="image-modal" class="ov hidden cursor-zoom-out" onclick="closeModal()">
    <img id="modal-img" src="" alt="" class="max-w-full max-h-[90vh] rounded-2xl object-contain" style="box-shadow:0 30px 80px rgba(0,0,0,.7)" onclick="event.stopPropagation()">
</div>

<div id="confirm" class="ov hidden">
    <div class="sf p-6 w-full max-w-[360px]">
        <h3 class="text-base font-semibold" id="confirm-text"></h3>
        <p class="mt-1.5 text-sm t-mut">История по этому человеку перестанет обновляться.</p>
        <div class="mt-6 flex justify-end gap-2">
            <button class="btn ghost" id="confirm-no">Отмена</button>
            <button class="btn bad" id="confirm-yes">Удалить</button>
        </div>
    </div>
</div>
<div id="toast" role="status"></div>

<!-- Авторизация -->
<div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto hidden content-wrapper">
    <div class="w-full max-w-[380px] relative z-10">
        <svg class="mx-auto h-14 w-14 rv" style="color:var(--tx)"><use href="#xm"/></svg>
        <h2 id="auth-title" class="disp mt-7 text-center text-[22px] rv d1">Вход в систему</h2>
        <p class="mt-2 text-center text-sm t-mut rv d1">XIVIVIDE Monitor</p>
        <form id="auth-form" class="sf mt-8 flex flex-col gap-3 p-5 rv d2">
            <input type="text" id="auth-user" placeholder="Логин" autocomplete="username" class="field" required>
            <input type="password" id="auth-pass" placeholder="Пароль" autocomplete="current-password" class="field" required>
            <input type="password" id="auth-confirm" placeholder="Повторите пароль" autocomplete="new-password" class="field hidden" required>
            <button type="submit" id="auth-btn" class="btn mt-1 w-full">Войти</button>
        </form>
        <div class="mt-5 text-center text-sm t-mut rv d3">
            <span id="auth-switch-text">Нет аккаунта?</span>
            <button type="button" id="auth-switch" class="ml-1 font-medium" style="color:var(--ac)">Создать</button>
        </div>
    </div>
</div>

<!-- Дашборд -->
<div id="app-screen" class="hidden h-full flex flex-col content-wrapper">
    <header class="sticky top-0 z-40 shrink-0 border-b backdrop-blur-xl" style="border-color:var(--hair);background:rgba(8,8,11,.72);padding-top:env(safe-area-inset-top,0px)">
        <div class="mx-auto flex max-w-[1300px] flex-wrap items-center justify-between gap-x-4 gap-y-3 px-4 py-3 sm:px-6">
            <a href="#feed" class="flex items-center gap-2.5">
                <svg class="h-7 w-7"><use href="#xm"/></svg>
                <span class="disp text-[13px] tracking-[.12em]">XIVIVIDE</span>
            </a>
            <div class="order-last flex w-full items-center sm:order-none sm:w-auto sm:flex-1 sm:justify-end sm:gap-3">
                <div class="addbox sm:max-w-[340px]">
                    <svg class="ml-2.5 h-4 w-4 shrink-0 t-mut" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" id="new-target-id" inputmode="numeric" placeholder="Discord ID пользователя" aria-label="Discord ID">
                    <button id="add-target-btn" class="btn">Добавить</button>
                </div>
            </div>
            <div class="relative sm:order-last">
                <button id="user-menu-btn" class="flex items-center gap-2.5 rounded-full border p-1 sm:pr-3.5 transition hover:bg-white/5" style="border-color:var(--hair)">
                    <div class="flex h-8 w-8 items-center justify-center rounded-full text-sm font-semibold" style="background:rgba(139,123,255,.16);color:var(--ac)" id="user-avatar-placeholder">?</div>
                    <span id="current-user-display" class="hidden text-sm font-medium sm:block"></span>
                </button>
                <div id="user-dropdown" class="sf absolute right-0 z-50 mt-2 hidden w-48 p-1.5" style="border-radius:14px">
                    <button id="logout-btn" class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-sm font-medium t-bad transition hover:bg-red-400/10">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Выйти
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="mx-auto flex w-full max-w-[1300px] flex-1 flex-col items-start gap-6 p-4 sm:p-6 lg:flex-row lg:gap-10">
        <aside class="flex w-full shrink-0 flex-col gap-4 lg:sticky lg:top-[92px] lg:w-[232px]">
            <nav class="flex gap-1 overflow-x-auto lg:flex-col">
                <a href="#feed" class="na" id="nav-feed"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" id="ni-feed"></svg>Лента</a>
                <a href="#tracking" class="na" id="nav-tracking"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" id="ni-tracking"></svg>Отслеживание</a>
            </nav>
            <div id="sub-menu-container" class="hidden border-t pt-4 lg:mt-1" style="border-color:var(--hair)">
                <div class="mb-3 flex items-center gap-3 px-1">
                    <img id="selected-target-ava" src="" alt="" class="ava h-9 w-9">
                    <div class="min-w-0"><div class="truncate text-sm font-semibold" id="selected-target-name"></div><div class="text-xs t-mut">Профиль цели</div></div>
                </div>
                <nav class="flex gap-1 overflow-x-auto lg:flex-col" id="sub-menu"></nav>
            </div>
        </aside>

        <main class="min-w-0 w-full flex-1">
            <div id="loader" class="flex h-[400px] flex-col items-center justify-center gap-3 t-mut">
                <svg class="h-6 w-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-sm">Загрузка...</span>
            </div>
            <div id="content"></div>
        </main>
    </div>
</div>

<script>
const ICONS = {
    feed: '<path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    users: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>',
    profile: '<path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>',
    server: '<path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>',
    tag: '<path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>',
    cal: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    copy: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>',
    trash: '<path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>'
};
const icon = (n, c = "h-4 w-4") => `<svg class="${c}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">${ICONS[n] || ''}</svg>`;
document.getElementById('ni-feed').innerHTML = ICONS.feed;
document.getElementById('ni-tracking').innerHTML = ICONS.users;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const avatarPlaceholder = (str) => {
    const s = str || '?'; let h = 0;
    for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
    const hue = Math.abs(h) % 360;
    return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="hsl(${hue},28%,14%)"/><text x="32" y="44" font-size="30" font-family="sans-serif" font-weight="600" text-anchor="middle" fill="hsl(${hue},65%,72%)">${esc(s.charAt(0).toUpperCase())}</text></svg>`)}`;
};
const formatDate = (iso) => {
    if (!iso || iso === 'unknown') return 'Неизвестно';
    if (/^\d{2}\.\d{2}\.\d{4}/.test(iso)) return iso;
    const d = new Date(iso); if (isNaN(d.getTime())) return iso;
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)} в ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const formatMinutes = (m) => { const h = Math.floor(m / 60), r = m % 60; return h > 0 ? `${h}ч ${r}м` : `${r}м`; };
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };

let DATA = {}, CURRENT_TARGET = null, USER_ID = null, userTargets = [], isRegistering = false, pollId = null;
const TABS = ['profile', 'servers', 'nicks', 'media', 'friends', 'events'];

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.color = bad ? 'var(--bad)' : 'var(--tx)';
    t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function askConfirm(text) {
    return new Promise(res => {
        const box = document.getElementById('confirm');
        document.getElementById('confirm-text').textContent = text;
        box.classList.remove('hidden'); box.classList.add('flex');
        const done = (v) => { box.classList.add('hidden'); box.classList.remove('flex'); res(v); };
        document.getElementById('confirm-yes').onclick = () => done(true);
        document.getElementById('confirm-no').onclick = () => done(false);
        box.onclick = (e) => { if (e.target === box) done(false); };
    });
}
window.openModal = (url) => {
    if (!url) return;
    const m = document.getElementById('image-modal');
    document.getElementById('modal-img').src = url;
    m.classList.remove('hidden'); m.classList.add('flex');
};
window.closeModal = () => { const m = document.getElementById('image-modal'); m.classList.add('hidden'); m.classList.remove('flex'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.addEventListener('click', (e) => {
    const dd = document.getElementById('user-dropdown');
    if (e.target.closest('#user-menu-btn')) { dd.classList.toggle('hidden'); return; }
    if (!dd.contains(e.target)) dd.classList.add('hidden');
    const o = e.target.closest('[data-open]'); if (o) return openModal(o.dataset.open);
    const rm = e.target.closest('[data-remove]'); if (rm) { e.stopPropagation(); return removeTarget(rm.dataset.remove); }
    const sel = e.target.closest('[data-select]'); if (sel) return selectTarget(sel.dataset.select);
    const cp = e.target.closest('[data-copy]');
    if (cp) navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast('Discord ID скопирован'));
});

/* ---------- Auth ---------- */
const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');

document.getElementById('auth-switch').addEventListener('click', () => {
    isRegistering = !isRegistering;
    document.getElementById('auth-title').textContent = isRegistering ? 'Регистрация' : 'Вход в систему';
    document.getElementById('auth-btn').textContent = isRegistering ? 'Создать' : 'Войти';
    document.getElementById('auth-switch-text').textContent = isRegistering ? 'Есть аккаунт?' : 'Нет аккаунта?';
    document.getElementById('auth-switch').textContent = isRegistering ? 'Войти' : 'Создать';
    document.getElementById('auth-confirm').classList.toggle('hidden', !isRegistering);
    document.getElementById('auth-confirm').required = isRegistering;
});

document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value;
    const c = document.getElementById('auth-confirm').value;
    if (isRegistering && p !== c) return toast('Пароли не совпадают', true);
    const btn = document.getElementById('auth-btn');
    btn.disabled = true; btn.textContent = '...';
    try {
        const res = await fetch(isRegistering ? '/api/register' : '/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            checkAuth();
        } else toast(data.detail || 'Ошибка', true);
    } catch (err) { toast('Сервер недоступен', true); }
    finally { btn.disabled = false; btn.textContent = isRegistering ? 'Создать' : 'Войти'; }
});

document.getElementById('logout-btn').addEventListener('click', () => { localStorage.clear(); checkAuth(); });

function checkAuth() {
    USER_ID = localStorage.getItem('user_id');
    clearInterval(pollId);
    if (USER_ID) {
        const name = localStorage.getItem('username') || '?';
        document.getElementById('current-user-display').textContent = name;
        document.getElementById('user-avatar-placeholder').textContent = name.charAt(0).toUpperCase();
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadTargets(); loadData();
        pollId = setInterval(loadData, 10000);
    } else {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
    }
}

/* ---------- Targets ---------- */
async function loadTargets() {
    if (!USER_ID) return;
    try {
        const res = await fetch(`/api/my_targets/${USER_ID}`);
        userTargets = await res.json();
        if (TABS.includes(location.hash.slice(1)) && !CURRENT_TARGET && userTargets.length) CURRENT_TARGET = userTargets[0].target_id;
        render();
    } catch (e) {}
}

document.getElementById('add-target-btn').addEventListener('click', async () => {
    const input = document.getElementById('new-target-id');
    const tid = input.value.trim();
    if (!/^\d{17,20}$/.test(tid)) {
        input.classList.add('err');
        toast('Discord ID — это 17–20 цифр', true);
        return setTimeout(() => input.classList.remove('err'), 1200);
    }
    try {
        const res = await fetch(`/api/add_target/${USER_ID}`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ target_id: tid, target_name: tid })
        });
        if (res.ok) {
            input.value = '';
            await loadTargets();
            CURRENT_TARGET = tid;
            window.location.hash = 'profile';
        } else { const err = await res.json(); toast(err.detail || 'Ошибка', true); }
    } catch (e) { toast('Ошибка сервера', true); }
});
document.getElementById('new-target-id').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('add-target-btn').click(); });

window.removeTarget = async (tid) => {
    if (!await askConfirm('Удалить цель из отслеживания?')) return;
    try {
        await fetch(`/api/remove_target/${USER_ID}/${tid}`, { method: 'DELETE' });
        if (CURRENT_TARGET === tid) CURRENT_TARGET = null;
        await loadTargets();
        window.location.hash = 'tracking';
    } catch (e) { toast('Не удалось удалить', true); }
};
function selectTarget(id) { CURRENT_TARGET = id; window.location.hash = 'profile'; }

const SUB_TABS = [
    { id: 'profile', label: 'Профиль', icon: 'profile' },
    { id: 'servers', label: 'Серверы', icon: 'server' },
    { id: 'nicks', label: 'Никнеймы', icon: 'tag' },
    { id: 'media', label: 'Медиа', icon: 'feed' },
    { id: 'friends', label: 'Знакомые', icon: 'users' },
    { id: 'events', label: 'События', icon: 'cal' }
];
const isOnline = (tid) => !!DATA.targets?.[tid]?.sessions?.some(s => s.dur === 'В сети');
const head = (t, s) => `<header class="ph"><h1>${t}</h1>${s ? `<p>${s}</p>` : ''}</header>`;

/* ---------- Router ---------- */
function render() {
    let hash = location.hash.slice(1) || 'feed';
    if (TABS.includes(hash) && !CURRENT_TARGET) {
        if (userTargets.length) CURRENT_TARGET = userTargets[0].target_id;
        else { hash = 'tracking'; window.location.hash = 'tracking'; }
    }
    document.getElementById('nav-feed').className = 'na' + (hash === 'feed' ? ' on' : '');
    document.getElementById('nav-tracking').className = 'na' + (hash === 'tracking' ? ' on' : '');

    const sub = document.getElementById('sub-menu-container');
    const tData = DATA.targets?.[CURRENT_TARGET];
    if (TABS.includes(hash) && CURRENT_TARGET) {
        sub.classList.remove('hidden');
        const name = tData?.user?.display || userTargets.find(t => t.target_id === CURRENT_TARGET)?.target_name || CURRENT_TARGET;
        document.getElementById('selected-target-name').textContent = name;
        document.getElementById('selected-target-ava').src = tData?.user?.avatar_url || avatarPlaceholder(name);
        document.getElementById('sub-menu').innerHTML = SUB_TABS.map(t =>
            `<a href="#${t.id}" class="na${t.id === hash ? ' on' : ''}">${icon(t.icon)}${t.label}</a>`).join('');
    } else sub.classList.add('hidden');

    document.getElementById('loader').style.display = 'none';
    const content = document.getElementById('content');
    const prev = content.dataset.view, view = hash + CURRENT_TARGET;
    let html;
    if (hash === 'feed') html = renderFeed();
    else if (hash === 'tracking') html = renderTrackingList();
    else if (!tData) html = `<div class="flex h-[400px] flex-col items-center justify-center gap-3 t-mut"><svg class="h-6 w-6 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg><p class="text-sm">Ожидание данных от бота...</p></div>`;
    else html = renderSubTab(hash, tData);
    content.innerHTML = html;
    if (prev !== view) { content.classList.remove('fade-in'); void content.offsetWidth; content.classList.add('fade-in'); content.dataset.view = view; }
}

function renderFeed() {
    const feed = DATA.global_feed || [];
    if (!feed.length) return head('Лента', 'Новые аватарки отслеживаемых людей') + renderEmpty('Лента пока пуста', 'Здесь появятся новые аватарки, как только кто-то из ваших целей их сменит.');
    return head('Лента', 'Новые аватарки отслеживаемых людей') + `<div class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4 xl:grid-cols-4">
        ${feed.map(f => `
        <div class="tile" data-open="${esc(f.url)}">
            <img class="pic" src="${esc(f.url)}" alt="" loading="lazy">
            <div class="cap"><img class="ava h-6 w-6" src="${esc(f.url)}" alt=""><b>${esc(f.user)}</b><span>${formatDate(f.time)}</span></div>
        </div>`).join('')}
    </div>`;
}

function renderTrackingList() {
    const n = userTargets.length;
    const h = head('Отслеживание', n ? `${n} ${plural(n, 'человек', 'человека', 'человек')} под наблюдением` : '');
    if (!n) return h + renderEmpty('Вы пока никого не отслеживаете', 'Вставьте Discord ID в поле сверху и нажмите «Добавить».');
    return h + `<div class="sf list">
        ${userTargets.map(t => {
            const u = DATA.targets?.[t.target_id]?.user || {};
            const name = u.display || t.target_name || t.target_id;
            const on = isOnline(t.target_id);
            return `<div class="row click" data-select="${esc(t.target_id)}">
                <img src="${esc(u.avatar_url || avatarPlaceholder(name))}" class="ava h-11 w-11" alt="">
                <div class="min-w-0 flex-1">
                    <div class="truncate text-sm font-semibold">${esc(name)}</div>
                    <div class="mt-0.5 font-mono text-[11px] t-mut">${esc(t.target_id)}</div>
                </div>
                <div class="flex items-center gap-2 text-sm ${on ? 't-ok' : 't-mut'}">${on ? '<i class="live"></i>' : ''}<span class="hidden sm:inline">${on ? 'В голосовом' : 'Не в голосовом'}</span></div>
                <button data-remove="${esc(t.target_id)}" aria-label="Удалить" class="rounded-lg p-2 t-mut transition hover:bg-red-400/10 hover:text-red-400">${icon('trash')}</button>
            </div>`;
        }).join('')}
    </div>`;
}

function renderSubTab(tab, data) {
    const label = SUB_TABS.find(t => t.id === tab)?.label;
    const sub = esc(data.user?.display || '');
    const fn = { profile: renderProfile, servers: renderServers, nicks: renderNicks, media: renderMedia, friends: renderFriends, events: renderEvents }[tab];
    return (tab === 'profile' ? '' : head(label, sub)) + (fn ? fn(data) : '');
}

const srvLogo = (src, name, size = 'h-11 w-11', r = 'rounded-xl') => src
    ? `<img src="${esc(src)}" class="${size} ${r} shrink-0 object-cover" alt="" onerror="this.src='${avatarPlaceholder(name)}'">`
    : `<div class="${size} ${r} flex shrink-0 items-center justify-center bg-white/[.06] text-sm font-semibold">${esc((name || '#').charAt(0).toUpperCase())}</div>`;

function renderProfile(data) {
    const u = data.user;
    const l = data.lastVoice || { server: '-', channel: '-', left: '-' };
    const noVoice = !l.server || l.server === '-';
    const on = isOnline(u.id) || isOnline(CURRENT_TARGET);
    let si = l.icon;
    if (!si && data.servers) si = data.servers.find(s => s.n === l.server)?.icon;
    const ph = avatarPlaceholder(u.display);
    const fact = (k, v) => `<div class="row justify-between"><span class="text-sm t-mut">${k}</span><span class="text-sm font-medium text-right break-all">${v}</span></div>`;

    return `
    <section class="sf flex flex-col items-center gap-6 p-6 text-center sm:flex-row sm:p-8 sm:text-left">
        <div class="relative shrink-0">
            <img src="${esc(u.avatar_url || ph)}" class="h-32 w-32 cursor-zoom-in rounded-[30px] object-cover" style="box-shadow:0 0 0 1px var(--hair2),0 20px 40px -12px rgba(0,0,0,.7)" data-open="${esc(u.avatar_url)}" onerror="this.src='${ph}'" alt="">
            ${on ? '<span class="absolute -bottom-1 -right-1 flex h-6 w-6 items-center justify-center rounded-full" style="background:var(--bg)"><i class="live"></i></span>' : ''}
        </div>
        <div class="min-w-0">
            <h2 class="truncate text-[28px] font-semibold leading-tight">${esc(u.display)}</h2>
            <p class="mt-1 text-sm t-mut">@${esc(u.username)}</p>
            <p class="mt-4 inline-flex items-center gap-2 text-sm ${on ? 't-ok' : 't-mut'}">${on ? '<i class="live"></i>В голосовом канале сейчас' : 'Сейчас не в голосовом'}</p>
        </div>
    </section>
    <div class="mt-4 grid gap-4 lg:grid-cols-5">
        <div class="sf list lg:col-span-3">
            ${fact('Discord ID', `<span class="inline-flex items-center gap-2"><span class="font-mono text-xs">${esc(u.id)}</span><button data-copy="${esc(u.id)}" aria-label="Скопировать" class="rounded-md p-1 t-mut transition hover:bg-white/10 hover:text-white">${icon('copy', 'h-3.5 w-3.5')}</button></span>`)}
            ${fact('Регистрация', formatDate(u.reg))}
            ${fact('Время в войсе', esc(u.voice || '0ч 0м'))}
        </div>
        <div class="sf flex items-center gap-4 p-5 lg:col-span-2">
            ${srvLogo(si, l.server, 'h-12 w-12')}
            <div class="min-w-0 flex-1">
                <div class="text-xs t-mut">Последняя сессия</div>
                <div class="mt-1 truncate text-sm font-medium">${noVoice ? 'Нет данных' : `${esc(l.server)} / ${esc(l.channel)}`}</div>
                ${noVoice ? '' : `<div class="mt-0.5 text-xs t-mut">${esc(l.left)}</div>`}
            </div>
        </div>
    </div>`;
}

function renderServers(data) {
    const s = data.servers || [];
    if (!s.length) return renderEmpty('Нет общих серверов');
    return `<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
        ${s.map(x => `
        <div class="sf flex items-center gap-4 p-4" style="border-radius:16px">
            ${srvLogo(x.icon, x.n, 'h-12 w-12')}
            <div class="min-w-0 flex-1">
                <h4 class="truncate text-sm font-semibold">${esc(x.n)}</h4>
                <div class="mt-1 text-xs t-mut">${Number(x.m).toLocaleString('ru-RU')} участников</div>
            </div>
            ${x.v > 0 ? `<div class="flex items-center gap-1.5 text-xs font-medium t-ok"><i class="live"></i>${x.v}</div>` : ''}
        </div>`).join('')}
    </div>`;
}

function renderNicks(data) {
    const n = data.nicks || [];
    if (!n.length) return renderEmpty('История никнеймов пуста');
    return `<div class="sf list">
        ${n.map((x, i) => `
        <div class="row"><i class="rail${i === 0 ? ' first' : ''}"></i>
            <div class="min-w-0 flex-1 truncate text-sm font-medium">${esc(x[0])}</div>
            <div class="hidden flex-1 truncate text-xs t-mut sm:block">${esc(x[1])}</div>
            <div class="text-right text-xs t-mut">${formatDate(x[2])}</div>
        </div>`).join('')}
    </div>`;
}

function renderMedia(data) {
    const m = data.media || [];
    if (!m.length) return renderEmpty('Нет аватарок');
    return `<div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">
        ${m.map(x => {
            const ok = x.s && x.s.startsWith('http');
            return `<div class="tile" ${ok ? `data-open="${esc(x.s)}"` : ''}><img class="pic" src="${ok ? esc(x.s) : avatarPlaceholder('?')}" alt="" loading="lazy" onerror="this.src='${avatarPlaceholder('?')}'"></div>`;
        }).join('')}
    </div>`;
}

function renderFriends(data) {
    const f = data.friends || [];
    if (!f.length) return renderEmpty('Нет совместных сессий');
    const max = Math.max(...f.map(x => x.min), 1);
    return `<div class="sf list">
        ${f.map(x => `
        <div class="row">
            <img src="${esc(x.avatar || avatarPlaceholder(x.u))}" class="ava h-9 w-9" alt="" onerror="this.src='${avatarPlaceholder(x.u)}'">
            <div class="min-w-0 flex-1">
                <div class="flex items-baseline justify-between gap-3"><span class="truncate text-sm font-medium">${esc(x.u)}</span><span class="shrink-0 text-xs t-mut">${formatMinutes(x.min)}</span></div>
                <div class="bar mt-2"><i style="width:${Math.max(3, x.min / max * 100)}%"></i></div>
            </div>
            <div class="hidden w-28 text-right text-xs t-mut sm:block">${esc(x.last)}</div>
        </div>`).join('')}
    </div>`;
}

function renderEvents(data) {
    let s = data.sessions || [];
    if (!s.length) return renderEmpty('История сессий пуста');
    let seen = false;
    s = s.filter(x => { if (x.dur === 'В сети') { if (seen) return false; seen = true; } return true; });
    return `<div class="sf list">
        ${s.map(x => {
            const ic = x.srv_icon || data.servers?.find(v => v.n === x.srv)?.icon;
            const live = x.dur === 'В сети';
            return `<div class="row">
                ${srvLogo(ic, x.srv, 'h-9 w-9', 'rounded-[10px]')}
                <div class="min-w-0 flex-1"><div class="truncate text-sm font-medium">${esc(x.srv)}</div><div class="mt-0.5 truncate text-xs t-mut"># ${esc(x.ch)}</div></div>
                <div class="flex items-center gap-2 text-sm ${live ? 't-ok font-semibold' : 't-mut'}">${live ? '<i class="live"></i>' : ''}${esc(x.dur)}</div>
                <div class="hidden w-40 text-right text-xs t-mut sm:block">${esc(x.per)}</div>
            </div>`;
        }).join('')}
    </div>`;
}

function renderEmpty(msg, hint) {
    return `<div class="sf flex min-h-[260px] flex-col items-center justify-center gap-2 px-6 text-center">
        <svg class="mb-2 h-10 w-10 opacity-60" style="color:var(--tx)"><use href="#xm"/></svg>
        <p class="text-sm font-medium">${msg}</p>
        ${hint ? `<p class="max-w-sm text-sm t-mut">${hint}</p>` : ''}
    </div>`;
}

async function loadData() {
    if (!USER_ID) return;
    try { DATA = await (await fetch('/api/data')).json(); render(); } catch (e) {}
}

window.addEventListener('hashchange', render);
checkAuth();
</script>
</body>
</html>
