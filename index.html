<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>XIVIVIDE Monitor</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                bg: '#09090b',
                panel: '#121215',
                card: '#18181b',
                line: '#27272a',
                tx: '#f4f4f5',
                mut: '#a1a1aa',
                accent: '#6366f1',
                accentHover: '#4f46e5',
                danger: '#ef4444',
                success: '#10b981'
            },
            fontFamily: {
                sans: ['"Geist"', '"Inter"', 'system-ui', 'sans-serif'],
                mono: ['"Geist Mono"', '"JetBrains Mono"', 'monospace']
            }
        }
    }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    *:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; border-radius: 4px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    .fade-in { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .skeleton { background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body class="h-full bg-bg text-tx font-sans antialiased selection:bg-accent/30 selection:text-white">

<!-- Экран Авторизации -->
<div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-bg/95 backdrop-blur-sm p-4" role="dialog" aria-modal="true">
    <div class="w-full max-w-[400px] rounded-2xl border border-line bg-panel p-8 shadow-2xl fade-in">
        <div class="mb-8 flex flex-col items-center">
            <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-accent/10 border border-accent/20">
                <svg class="h-6 w-6 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h2 id="auth-title" class="text-xl font-semibold tracking-tight">Доступ к мониторингу</h2>
            <p class="mt-1 text-sm text-mut">Введите данные для входа в систему</p>
        </div>

        <form id="auth-form" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-mut ml-1">Логин</label>
                <input type="text" id="auth-user" autocomplete="username" placeholder="admin" class="h-10 w-full rounded-lg border border-line bg-bg px-3 text-sm text-tx placeholder:text-zinc-600 focus:border-accent/60 transition-colors" required>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-mut ml-1">Пароль</label>
                <input type="password" id="auth-pass" autocomplete="current-password" placeholder="••••••••" class="h-10 w-full rounded-lg border border-line bg-bg px-3 text-sm text-tx placeholder:text-zinc-600 focus:border-accent/60 transition-colors" required>
            </div>
            <div id="confirm-wrapper" class="flex flex-col gap-1.5 hidden">
                <label class="text-xs font-medium text-mut ml-1">Повторите пароль</label>
                <input type="password" id="auth-confirm" autocomplete="new-password" placeholder="••••••••" class="h-10 w-full rounded-lg border border-line bg-bg px-3 text-sm text-tx placeholder:text-zinc-600 focus:border-accent/60 transition-colors">
            </div>
            <button type="submit" id="auth-btn" class="mt-2 flex h-10 w-full items-center justify-center rounded-lg bg-accent px-4 text-sm font-semibold text-white transition-all hover:bg-accentHover active:scale-[0.98]">Войти в систему</button>
        </form>

        <div class="mt-6 text-center text-xs text-mut">
            <span id="auth-switch-text">Нет аккаунта?</span>
            <button type="button" id="auth-switch" class="ml-1 font-medium text-accent hover:text-accentHover transition-colors focus:underline">Создать аккаунт</button>
        </div>
    </div>
</div>

<!-- Основной Дашборд -->
<div id="app-screen" class="hidden h-full flex flex-col">
    <nav class="sticky top-0 z-30 flex h-14 shrink-0 items-center justify-between border-b border-line bg-bg/80 px-4 backdrop-blur-md sm:px-6">
        <div class="flex items-center gap-3">
            <div class="flex h-7 w-7 items-center justify-center rounded-md bg-accent text-white shadow-sm">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <span class="text-sm font-bold tracking-wide text-tx">XIVIVIDE MONITOR</span>
            <span class="rounded-full bg-line px-2 py-0.5 text-[10px] font-medium text-mut">v2.4</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="hidden items-center gap-2 sm:flex">
                <span class="relative flex h-2 w-2">
                    <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-success opacity-75"></span>
                    <span class="relative inline-flex h-2 w-2 rounded-full bg-success"></span>
                </span>
                <span class="text-xs text-mut">API Connected</span>
            </div>
            <div class="h-5 w-px bg-line"></div>
            <div class="flex items-center gap-3">
                <span id="current-user-display" class="text-sm font-medium text-tx"></span>
                <button id="logout-btn" class="group flex h-8 items-center gap-1.5 rounded-md border border-line bg-panel px-2.5 text-xs font-medium text-mut transition-colors hover:border-danger/30 hover:bg-danger/10 hover:text-danger">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Выйти
                </button>
            </div>
        </div>
    </nav>

    <div class="mx-auto flex w-full max-w-[1400px] flex-1 items-start gap-6 p-4 sm:p-6 lg:flex-row flex-col">
        <!-- Сайдбар -->
        <aside class="flex w-full flex-col gap-4 lg:sticky lg:top-[80px] lg:w-[280px] shrink-0">
            
            <!-- Добавление цели -->
            <div class="rounded-xl border border-line bg-panel p-3 shadow-sm">
                <h3 class="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-mut">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    Новая цель
                </h3>
                <div class="flex flex-col gap-2">
                    <input type="text" id="new-target-id" placeholder="Discord ID" class="h-9 w-full rounded-md border border-line bg-bg px-2.5 text-xs text-tx placeholder:text-zinc-600 focus:border-accent/60 transition-colors">
                    <input type="text" id="new-target-name" placeholder="Отображаемое имя" class="h-9 w-full rounded-md border border-line bg-bg px-2.5 text-xs text-tx placeholder:text-zinc-600 focus:border-accent/60 transition-colors">
                    <button id="add-target-btn" class="mt-1 flex h-9 w-full items-center justify-center rounded-md bg-white px-3 text-xs font-semibold text-black transition-all hover:bg-zinc-200 active:scale-[0.98]">Отслеживать</button>
                </div>
                <p class="mt-2 text-[10px] leading-tight text-zinc-500">Бот начнет слежку в течение 60 секунд.</p>
            </div>

            <!-- Список целей -->
            <div class="flex flex-col rounded-xl border border-line bg-panel p-2 shadow-sm">
                <div class="mb-1 flex items-center justify-between px-1">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-mut">Активные цели</h3>
                    <span id="target-count" class="rounded bg-line px-1.5 py-0.5 text-[10px] font-mono text-mut">0</span>
                </div>
                <div id="target-list" class="flex max-h-[300px] flex-col gap-0.5 overflow-y-auto pr-1"></div>
            </div>

            <!-- Навигация -->
            <nav class="flex flex-row gap-1 overflow-x-auto pb-1 lg:flex-col lg:pb-0">
                <div id="menu" class="flex flex-row gap-1 lg:flex-col w-full"></div>
            </nav>

        </aside>

        <!-- Основной контент -->
        <main id="view" class="min-w-0 flex-1">
            <div id="loader" class="flex h-[400px] flex-col items-center justify-center gap-4">
                <svg class="h-8 w-8 animate-spin text-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="text-sm text-mut">Загрузка профиля...</span>
            </div>
            <div id="empty-state" class="hidden flex-col items-center justify-center rounded-xl border border-dashed border-line bg-panel/50 p-12 text-center h-[400px]">
                <div class="mb-4 rounded-full bg-line p-4">
                    <svg class="h-8 w-8 text-mut" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <h3 class="text-lg font-semibold text-tx">Нет выбранной цели</h3>
                <p class="mt-1 max-w-xs text-sm text-mut">Добавьте Discord ID в панели слева, чтобы начать отслеживание.</p>
            </div>
        </main>
    </div>
</div>

<script>
// ============ ИКОНКИ ============
const ICONS = {
    profile: '<path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>',
    server: '<path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>',
    tag: '<path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>',
    image: '<path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    users: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>',
    cal: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>',
    mic: '<path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>',
    id: '<path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"/>',
    clock: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>',
    eye: '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>'
};

const icon = (name, cls = "h-4 w-4") => `<svg class="${cls}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">${ICONS[name] || ''}</svg>`;

const avatarPlaceholder = (str) => {
    const safeStr = str || '?';
    let hash = 0;
    for (let i = 0; i < safeStr.length; i++) hash = safeStr.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    const letter = safeStr.charAt(0).toUpperCase();
    return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="hsl(${hue},30%,15%)"/><text x="32" y="45" font-size="32" font-family="sans-serif" font-weight="600" text-anchor="middle" fill="hsl(${hue},70%,70%)">${letter}</text></svg>`)}`;
};

// ИСПРАВЛЕНО: Безопасный парсер дат (чтобы не было NaN)
const formatDate = (isoStr) => {
    if (!isoStr || isoStr === 'unknown') return 'Неизвестно';
    // Если бот уже прислал красивую строку (типа "15.10.2024, 12:00:00"), просто отдаем её
    if (/^\d{2}\.\d{2}\.\d{4}/.test(isoStr)) return isoStr;
    
    const d = new Date(isoStr);
    if (isNaN(d.getTime())) return isoStr; // Защита от кривых дат
    
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

const formatMinutes = (min) => {
    const h = Math.floor(min / 60);
    const m = min % 60;
    if (h > 0) return `${h}ч ${m}м`;
    return `${m}м`;
};

// ============ СОСТОЯНИЕ ============
let DATA = {};
let CURRENT_TARGET = null;
let USER_ID = null;
let userTargets = [];
let isRegistering = false;

// ============ АВТОРИЗАЦИЯ ============
const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const authForm = document.getElementById('auth-form');
const confirmWrapper = document.getElementById('confirm-wrapper');

document.getElementById('auth-switch').addEventListener('click', () => {
    isRegistering = !isRegistering;
    document.getElementById('auth-title').textContent = isRegistering ? 'Создание аккаунта' : 'Доступ к мониторингу';
    document.getElementById('auth-btn').textContent = isRegistering ? 'Зарегистрироваться' : 'Войти в систему';
    document.getElementById('auth-switch-text').textContent = isRegistering ? 'Уже есть доступ?' : 'Нет аккаунта?';
    document.getElementById('auth-switch').textContent = isRegistering ? 'Войти' : 'Создать аккаунт';
    confirmWrapper.classList.toggle('hidden', !isRegistering);
    document.getElementById('auth-confirm').required = isRegistering;
});

authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value;
    const c = document.getElementById('auth-confirm').value;

    if (isRegistering && p !== c) return alert("Пароли не совпадают!");

    const url = isRegistering ? '/api/register' : '/api/login';
    const btn = document.getElementById('auth-btn');
    btn.disabled = true;
    btn.innerHTML = `<svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            checkAuth();
        } else {
            alert(data.detail || "Ошибка авторизации");
        }
    } catch (e) {
        alert("Сервер недоступен");
    } finally {
        btn.disabled = false;
        btn.textContent = isRegistering ? 'Зарегистрироваться' : 'Войти в систему';
    }
});

document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.clear();
    checkAuth();
});

function checkAuth() {
    USER_ID = localStorage.getItem('user_id');
    if (USER_ID) {
        document.getElementById('current-user-display').textContent = localStorage.getItem('username');
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadTargets();
        loadData();
        setInterval(loadData, 10000); // Автообновление раз в 10 сек
    } else {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
    }
}

// ============ УПРАВЛЕНИЕ ЦЕЛЯМИ ============
async function loadTargets() {
    if (!USER_ID) return;
    try {
        const res = await fetch(`/api/my_targets/${USER_ID}`);
        userTargets = await res.json();
        renderTargetList();
    } catch (e) {}
}

function renderTargetList() {
    const list = document.getElementById('target-list');
    const counter = document.getElementById('target-count');
    counter.textContent = userTargets.length;

    if (userTargets.length === 0) {
        list.innerHTML = `<div class="py-4 text-center text-xs text-zinc-500">Список пуст</div>`;
        return;
    }

    list.innerHTML = userTargets.map(t => {
        const isSelected = CURRENT_TARGET === t.target_id;
        return `
        <div class="group flex cursor-pointer items-center justify-between rounded-md border px-2.5 py-2 transition-all ${isSelected ? 'border-accent/40 bg-accent/10' : 'border-transparent hover:bg-line/50'}" onclick="selectTarget('${t.target_id}')">
            <div class="flex flex-col min-w-0">
                <span class="truncate text-sm font-medium ${isSelected ? 'text-white' : 'text-tx'}">${t.target_name}</span>
                <span class="truncate font-mono text-[10px] text-mut">${t.target_id}</span>
            </div>
            <button class="flex h-6 w-6 items-center justify-center rounded text-mut opacity-0 transition-opacity hover:bg-danger/20 hover:text-danger group-hover:opacity-100" 
                    onclick="event.stopPropagation(); removeTarget('${t.target_id}')" aria-label="Удалить цель">
                <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
        </div>`;
    }).join('');
}

function selectTarget(id) {
    CURRENT_TARGET = id;
    renderTargetList();
    render();
}

document.getElementById('add-target-btn').addEventListener('click', async () => {
    const tidInput = document.getElementById('new-target-id');
    const tnameInput = document.getElementById('new-target-name');
    const tid = tidInput.value.trim();
    const tname = tnameInput.value.trim() || tid;

    if (!tid || !/^\d{17,20}$/.test(tid)) {
        tidInput.classList.add('border-danger/50');
        return alert("Введите корректный Discord ID (17-20 цифр)");
    }
    tidInput.classList.remove('border-danger/50');

    try {
        const res = await fetch(`/api/add_target/${USER_ID}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ target_id: tid, target_name: tname })
        });
        if (res.ok) {
            tidInput.value = '';
            tnameInput.value = '';
            await loadTargets();
            selectTarget(tid);
        } else {
            const err = await res.json();
            alert(err.detail);
        }
    } catch (e) {
        alert("Ошибка сервера");
    }
});

window.removeTarget = async (tid) => {
    if (!confirm("Удалить эту цель из мониторинга?")) return;
    try {
        await fetch(`/api/remove_target/${USER_ID}/${tid}`, { method: 'DELETE' });
        if (CURRENT_TARGET === tid) CURRENT_TARGET = null;
        await loadTargets();
        if (userTargets.length > 0) selectTarget(userTargets[0].target_id);
        else render();
    } catch (e) {}
};

// ============ ОТОБРАЖЕНИЕ ============
const TABS = [
    { id: 'profile', label: 'Профиль', icon: 'profile' },
    { id: 'servers', label: 'Серверы', icon: 'server' },
    { id: 'nicks', label: 'Никнеймы', icon: 'tag' },
    { id: 'media', label: 'Медиа', icon: 'image' },
    { id: 'friends', label: 'Знакомые', icon: 'users' },
    { id: 'events', label: 'События', icon: 'cal' }
];

function render() {
    const hash = (location.hash.slice(1) || 'profile');
    const activeTab = TABS.find(t => t.id === hash) ? hash : 'profile';

    document.getElementById('menu').innerHTML = TABS.map(t => {
        const isActive = t.id === activeTab;
        return `<a href="#${t.id}" class="group flex h-9 items-center gap-2.5 rounded-md px-3 text-sm font-medium transition-colors ${isActive ? 'bg-accent/10 text-accent' : 'text-mut hover:bg-line/50 hover:text-tx'}">
            ${icon(t.icon, `h-4 w-4 ${isActive ? 'text-accent' : 'text-mut group-hover:text-tx'}`)}
            ${t.label}
        </a>`;
    }).join('');

    const view = document.getElementById('view');
    const loader = document.getElementById('loader');
    const emptyState = document.getElementById('empty-state');

    if (!CURRENT_TARGET) {
        loader.classList.add('hidden');
        view.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
    }

    emptyState.classList.add('hidden');
    emptyState.classList.remove('flex');
    loader.classList.add('hidden');

    const targetData = DATA.targets?.[CURRENT_TARGET];
    if (!targetData) {
        view.innerHTML = `<div class="flex h-[400px] flex-col items-center justify-center text-mut">
            <svg class="mb-3 h-8 w-8 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            <p>Ожидание данных от локального бота...</p>
        </div>`;
        return;
    }

    view.innerHTML = `<div class="fade-in">${renderTab(activeTab, targetData)}</div>`;
}

function renderTab(tabId, data) {
    switch (tabId) {
        case 'profile': return renderProfile(data);
        case 'servers': return renderServers(data);
        case 'nicks': return renderNicks(data);
        case 'media': return renderMedia(data);
        case 'friends': return renderFriends(data);
        case 'events': return renderEvents(data);
        default: return '';
    }
}

function renderProfile(data) {
    const u = data.user;
    const l = data.lastVoice || { server: '-', channel: '-', left: '-' };

    const row = (iconName, label, value) => `
        <div class="flex flex-col gap-1 border-b border-line/50 py-3 sm:flex-row sm:items-center">
            <span class="flex w-40 shrink-0 items-center gap-2 text-xs font-medium text-mut">
                ${icon(iconName, 'h-3.5 w-3.5')} ${label}
            </span>
            <span class="break-all text-sm font-medium text-tx">${value}</span>
        </div>`;

    // ИСПРАВЛЕНО: Красивое отображение пустой голосовой сессии
    const isNoVoice = l.server === '-' || !l.server;
    const voiceServer = isNoVoice ? 'Нет данных' : l.server;
    const voiceChannel = isNoVoice ? '' : `<span class="text-zinc-600">/</span><span class="text-zinc-300">${l.channel}</span>`;
    const lastEvent = isNoVoice ? '—' : l.left;

    return `
    <div class="grid gap-4 lg:grid-cols-3">
        <div class="flex flex-col gap-4 rounded-xl border border-line bg-panel p-4 shadow-sm">
            <div class="aspect-square w-full overflow-hidden rounded-lg border border-line bg-bg">
                <img src="${u.avatar_url || avatarPlaceholder(u.display)}" alt="Аватар" class="h-full w-full object-cover" onerror="this.src='${avatarPlaceholder(u.display)}'">
            </div>
            <div class="flex flex-col gap-1 text-center">
                <h2 class="text-lg font-bold text-tx">${u.display}</h2>
                <p class="font-mono text-xs text-mut">@${u.username}</p>
            </div>
        </div>
        
        <div class="flex flex-col rounded-xl border border-line bg-panel px-4 py-2 shadow-sm lg:col-span-2">
            ${row('user', 'Username', `@${u.username}`)}
            ${row('user', 'Display Name', u.display)}
            ${row('id', 'Discord ID', `<span class="font-mono text-xs">${u.id}</span>`)}
            ${row('cal', 'Дата регистрации', formatDate(u.reg))}
            ${row('clock', 'Время в голосовых', u.voice || '0ч 0м')}
            ${row('eye', 'Просмотры профиля', u.views || '0')}
        </div>

        <div class="rounded-xl border border-line bg-[#141416] p-4 shadow-sm lg:col-span-3 lg:flex lg:items-center lg:justify-between">
            <div class="flex items-center gap-4">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-accent/10 border border-accent/20">
                    ${icon('mic', 'h-5 w-5 text-accent')}
                </div>
                <div>
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-mut">Последняя голосовая сессия</h4>
                    <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm font-medium text-tx">
                        <span>${voiceServer}</span>
                        ${voiceChannel}
                    </div>
                </div>
            </div>
            <div class="mt-3 text-xs text-mut lg:mt-0 lg:text-right">
                <span class="block">Последнее событие</span>
                <span class="font-mono text-zinc-400">${lastEvent}</span>
            </div>
        </div>
    </div>`;
}

function renderServers(data) {
    const servers = data.servers || [];
    if (servers.length === 0) return renderEmpty('Общих серверов не обнаружено');

    return `<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        ${servers.map(s => `
        <div class="flex items-start gap-3 rounded-xl border border-line bg-panel p-3 shadow-sm transition-colors hover:border-zinc-700">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-line font-bold text-zinc-300">
                ${s.n.charAt(0).toUpperCase()}
            </div>
            <div class="min-w-0 flex-1">
                <h4 class="truncate text-sm font-semibold text-tx" title="${s.n}">${s.n}</h4>
                <div class="mt-1 flex flex-col gap-0.5 text-xs text-mut">
                    <span>Участников: ${s.m.toLocaleString('ru-RU')}</span>
                    <span class="flex items-center gap-1">
                        <span class="h-1.5 w-1.5 rounded-full bg-success"></span>
                        В голосе: ${s.v}
                    </span>
                </div>
            </div>
        </div>`).join('')}
    </div>`;
}

function renderNicks(data) {
    const nicks = data.nicks || [];
    if (nicks.length === 0) return renderEmpty('История смены никнеймов пуста');

    return `<div class="overflow-hidden rounded-xl border border-line bg-panel shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="border-b border-line bg-[#141416] text-xs font-semibold text-mut">
                    <tr>
                        <th scope="col" class="px-4 py-3">Никнейм</th>
                        <th scope="col" class="px-4 py-3">Источник</th>
                        <th scope="col" class="px-4 py-3 text-right">Дата смены</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-line/50">
                    ${nicks.map(n => `
                    <tr class="transition-colors hover:bg-line/20">
                        <td class="px-4 py-3 font-medium text-tx">${n[0]}</td>
                        <td class="px-4 py-3 text-mut">${n[1]}</td>
                        <td class="px-4 py-3 text-right font-mono text-xs text-mut">${formatDate(n[2])}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>
    </div>`;
}

function renderMedia(data) {
    const media = data.media || [];
    if (media.length === 0) return renderEmpty('Нет сохранённых аватарок');

    return `<div class="grid grid-cols-3 gap-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6">
        ${media.map(m => {
            const isUrl = m.s && m.s.startsWith('http');
            return `<div class="group relative aspect-square overflow-hidden rounded-lg border border-line bg-panel">
                <img src="${isUrl ? m.s : avatarPlaceholder('?')}" alt="История аватарки" class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" onerror="this.src='${avatarPlaceholder('?')}'">
            </div>`;
        }).join('')}
    </div>`;
}

function renderFriends(data) {
    const friends = data.friends || [];
    if (friends.length === 0) return renderEmpty('Нет данных о совместных сессиях');

    return `<div class="overflow-hidden rounded-xl border border-line bg-panel shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="border-b border-line bg-[#141416] text-xs font-semibold text-mut">
                    <tr>
                        <th scope="col" class="px-4 py-3">Пользователь</th>
                        <th scope="col" class="px-4 py-3">Провели вместе</th>
                        <th scope="col" class="px-4 py-3 text-right">Последний раз</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-line/50">
                    ${friends.map(f => `
                    <tr class="transition-colors hover:bg-line/20">
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <div class="flex h-6 w-6 items-center justify-center rounded-full bg-line text-[10px] font-bold text-zinc-300">
                                    ${f.u.charAt(0).toUpperCase()}
                                </div>
                                <span class="font-medium text-tx">${f.u}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-mut">${formatMinutes(f.min)}</td>
                        <td class="px-4 py-3 text-right font-mono text-xs text-mut">${f.last}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>
    </div>`;
}

function renderEvents(data) {
    const sessions = data.sessions || [];
    if (sessions.length === 0) return renderEmpty('История голосовых сессий пуста');

    return `<div class="overflow-hidden rounded-xl border border-line bg-panel shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="border-b border-line bg-[#141416] text-xs font-semibold text-mut">
                    <tr>
                        <th scope="col" class="px-4 py-3">Сервер / Канал</th>
                        <th scope="col" class="px-4 py-3">Длительность</th>
                        <th scope="col" class="px-4 py-3 text-right">Период</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-line/50">
                    ${sessions.map(s => `
                    <tr class="transition-colors hover:bg-line/20">
                        <td class="px-4 py-3">
                            <div class="flex flex-col">
                                <span class="font-medium text-tx">${s.srv}</span>
                                <span class="text-xs text-mut"># ${s.ch}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3">
                            <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ${s.dur === 'В сети' ? 'bg-success/10 text-success' : 'bg-line text-zinc-300'}">
                                ${s.dur}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-right font-mono text-xs text-mut">${s.per}</td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>
    </div>`;
}

function renderEmpty(msg) {
    return `<div class="flex h-64 flex-col items-center justify-center rounded-xl border border-dashed border-line bg-panel/30 text-center">
        <svg class="mb-3 h-10 w-10 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
        <p class="text-sm font-medium text-zinc-400">${msg}</p>
    </div>`;
}

async function loadData() {
    if (!USER_ID) return;
    try {
        const res = await fetch('/api/data');
        DATA = await res.json();
        if (CURRENT_TARGET) render();
    } catch (e) {}
}

window.addEventListener('hashchange', render);
checkAuth();
</script>
</body>
</html>
